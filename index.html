      <textarea class="inp" id="vNota" placeholder="Ex.: achou o preço alto, voltar quando chegar a promoção">${crono && crono.notas && crono.notas.length ? esc(crono.notas.map(n => hhmm(n.t) + ' ' + n.txt).join('\n')) : ''}</textarea></label>
    <label class="f">Foto da fachada</label>
    <div class="foto-campo">
      <img id="vFotoPrev" alt="Foto da fachada" hidden>
      <button type="button" class="btn block" id="vFotoBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Adicionar foto</span></button>
      <input type="file" id="vFotoInp" accept="image/*" hidden>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn grow" id="vCancel">Voltar</button>
      <button class="btn primary grow" id="vSave">Salvar visita</button>
    </div>
    ${crono ? '<button class="linkbtn" id="vDescartar" style="display:block;margin:14px auto 0;color:var(--warn)">Descartar esta visita</button>' : ''}
  `);
  ligarSeg();
  // Duração ao vivo a partir dos horários
  const minutosDosCampos = () => {
    const a = $('#vIni').value, b = $('#vFim').value; if(!a || !b) return null;
    const [ah, am] = a.split(':').map(Number), [bh, bm] = b.split(':').map(Number);
    let m = (bh*60 + bm) - (ah*60 + am); if(m < 0) m += 24*60; // passou da meia-noite
    return m;
  };
  const mostrarDur = () => { const m = minutosDosCampos(); $('#vDur').textContent = m === null ? '' : `Duração: ${fmtMin(m)}`; };
  $('#vIni').oninput = $('#vFim').oninput = mostrarDur; mostrarDur();
  $('#vFotoBtn').onclick = () => $('#vFotoInp').click();
  // Preparar a foto leva um instante; o "Salvar" espera terminar (fotoPronta)
  let fotoPronta = null;
  $('#vFotoInp').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    $('#vFotoBtn span').textContent = 'Preparando foto…';
    fotoPronta = (async () => {
      try{
        fotoNova = await reduzirFoto(f);
        const prev = $('#vFotoPrev'); if(prev){ prev.src = URL.createObjectURL(fotoNova); prev.hidden = false; }

      }catch(err){ if($('#vFotoBtn span')) $('#vFotoBtn span').textContent = 'Adicionar foto'; toast('Não consegui abrir essa foto.'); }
    })();
  };

  if($('#vDescartar')) $('#vDescartar').onclick = async () => {

  };

    const res = statusEscolhido('');
    if(!res){ toast('Escolha o resultado da visita'); return; }
    if(fotoPronta){ $('#vSave').disabled = true; await fotoPronta; $('#vSave').disabled = false; }
    const dia = crono ? diaLocal(crono.inicio) : ($('#vData').value || iso);
    const noDia = hhmmTxt => new Date(`${dia}T${hhmmTxt}:00`).getTime();

      const tIni = noDia(ini), m = minutosDosCampos();
      visita.data = new Date(tIni).toISOString();
      if(m !== null){ visita.fim = new Date(tIni + m*60000).toISOString(); visita.min = m; }
    } else {
      // Sem horário: hoje usa a hora atual; outro dia fica ao meio-dia e marcado como "sem hora"
      visita.data = dia === iso ? new Date().toISOString() : new Date(dia + 'T12:00:00').toISOString();
      if(dia !== iso) visita.semHora = true;
    }
    if(fotoNova){
      const fid = uid();
      try{ await FotoDB.salvar(fid, fotoNova); visita.foto = {id:fid}; }
      catch(err){ toast('Não consegui guardar a foto neste aparelho. A visita foi salva sem ela.'); }
    }
    c.visitas = c.visitas || [];
    c.visitas.push(visita);
    c.status = res;
    if(dia === iso) marcarFeita(id);
    const virou = converter(c);
    if(crono){ va = null; salvarVA(); }
    salvar(); desenhar(); fecharPainel(); // pedido do usuário: salvar a visita fecha o card
    toast(virou ? 'Comprou! Agora é cliente da carteira' : 'Visita registrada');
  };
}

function baixar(nome, conteudo, tipo){
  const url = URL.createObjectURL(new Blob([conteudo], {type:tipo}));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ================= Importar KML / KMZ ================= */
$('#fileKml').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  toast('Lendo o arquivo…');
  let texto;
  try{
    const buf = await f.arrayBuffer();
    const bytes = new Uint8Array(buf.slice(0,4));
    const ehZip = bytes[0]===0x50 && bytes[1]===0x4B; // KMZ é um arquivo compactado
    if(ehZip){
      if(typeof JSZip === 'undefined') throw new Error('O leitor de KMZ não carregou. Verifique a internet ou exporte como KML.');
      const zip = await JSZip.loadAsync(buf);
      const kmls = Object.values(zip.files).filter(z => !z.dir && /\.kml$/i.test(z.name));
      if(!kmls.length) throw new Error('O arquivo KMZ não tem nenhum KML dentro.');
      texto = await (kmls.find(z=>/(^|\/)doc\.kml$/i.test(z.name)) || kmls[0]).async('string');
    } else {
      texto = new TextDecoder('utf-8').decode(buf);
    }
  }catch(err){ mostrarResultado({erro: err.message || 'Não consegui abrir o arquivo.', arquivo:f.name}); return; }
  try{ mostrarResultado({...importarKML(texto), arquivo:f.name}); }
  catch(err){ mostrarResultado({erro: err.message || String(err), arquivo:f.name}); }
});

// DOMParser cria um documento inerte: scripts e onerror de imagens do KML não rodam
function limparHtml(s){
  const d = new DOMParser().parseFromString(String(s||'').replace(/<br\s*\/?>/gi,'\n'), 'text/html');
  return (d.body.textContent || '').trim();
}
// Busca elementos pelo nome sem depender de namespace (kml:Placemark, Placemark, etc.)
function todos(raiz, nome){ return [...raiz.getElementsByTagName('*')].filter(el => el.localName === nome); }
function primeiro(raiz, nome){ return todos(raiz, nome)[0]; }
function filhoDireto(raiz, nome){ return [...raiz.children].find(el => el.localName === nome); }

function importarKML(texto){
  texto = texto.replace(/^\uFEFF/, '').trim();
  if(!/<(\w+:)?(kml|Placemark|NetworkLink)\b/i.test(texto))
    throw new Error('Esse arquivo não parece ser um KML. No My Maps use "Exportar para KML/KMZ".');
  let doc = new DOMParser().parseFromString(texto, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length){
    // XML com algum defeito: tenta uma leitura mais tolerante
    doc = new DOMParser().parseFromString(texto, 'text/html');
  }
  const low = n => n.toLowerCase();
  const achar = (r,n) => { const t = todos(r,n); return t.length ? t : todos(r, low(n)); };
  const um = (r,n) => achar(r,n)[0];

  const pms = achar(doc, 'Placemark');
  const links = achar(doc, 'NetworkLink');
  let novos = 0, repetidos = 0, semPonto = 0, lugares = 0;
  pms.forEach(pm => {
    const pt = um(pm, 'Point');
    const coord = pt && um(pt, 'coordinates');
    if(!coord){ semPonto++; return; }
    const [lng,lat] = coord.textContent.trim().split(/[\s,]+/).map(Number);
    if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180){ semPonto++; return; }
    const nomeEl = [...pm.children].find(el => low(el.localName)==='name');
    const nome = (nomeEl?.textContent || 'Sem nome').trim() || 'Sem nome';
    // Lugares (hotel, restaurante, posto, casa) exportados por este app voltam como lugares, não como clientes
    const estilo = (um(pm,'styleUrl')?.textContent || '').trim();
    if(estilo === '#st-casa'){ if(!R.casa){ R.casa = {lat, lng}; salvarR(); } lugares++; return; }
    const tipoLugar = (estilo.match(/^#st-(hotel|restaurante|posto)$/) || [])[1];
    if(tipoLugar){
      if(!hoteis.some(h => h.nome===nome && Math.abs(h.lat-lat)<1e-6 && Math.abs(h.lng-lng)<1e-6)){
        const desc = limparHtml([...pm.children].find(el => low(el.localName)==='description')?.textContent).split('\n');
        const campo = p => (desc.find(l => l.startsWith(p)) || '').slice(p.length).trim();
        hoteis.push({id:uid(), tipo:tipoLugar, nome, telefone:campo('Telefone: '), endereco:campo('Endereço: '), obs:desc.filter(l => !/^(Telefone|Endereço): /.test(l)).join('\n').trim(), lat, lng, criadoEm:new Date().toISOString()});
        salvarL();
      }
      lugares++; return;
    }
    if(clientes.some(c => c.nome===nome && Math.abs(c.lat-lat)<1e-6 && Math.abs(c.lng-lng)<1e-6)){ repetidos++; return; }
    const extras = achar(pm, 'Data').map(d => {
      const v = um(d,'value')?.textContent?.trim();
      return v ? `${d.getAttribute('name')}: ${v}` : '';
    }).filter(Boolean);
    const descEl = [...pm.children].find(el => low(el.localName)==='description');
    let desc = limparHtml(descEl?.textContent);
    if(extras.length && extras.every(x => desc.includes(x.split(': ').slice(1).join(': ')))) desc = '';
    const pai = pm.parentElement;
    const pastaEl = pai && low(pai.localName)==='folder' ? [...pai.children].find(el => low(el.localName)==='name') : null;
    const pasta = pastaEl?.textContent?.trim() || '';
    const tel = extras.find(x => /telefone|fone|celular|whats/i.test(x));
    const end = extras.find(x => /endere|rua|logradouro/i.test(x));
    clientes.push({
      id:uid(), nome, responsavel:'',
      telefone: tel ? tel.split(': ').slice(1).join(': ') : '',
      endereco: end ? end.split(': ').slice(1).join(': ') : '',
      obs: [pasta && 'Camada no My Maps: '+pasta, desc, ...extras.filter(x=>x!==tel && x!==end)].filter(Boolean).join('\n'),
      status:'nao', tipo:'cliente', lat, lng, criadoEm:new Date().toISOString(), visitas:[]
    });
    novos++;
  });
  salvar(); filtro='todos'; busca=''; $('#q').value=''; $('#searchBox').classList.remove('has');
  desenhar();
  if(novos) enquadrar(clientes);
  return {novos, repetidos, semPonto, lugares, total:pms.length, linkRede: links.length>0 && !pms.length};
}

function mostrarResultado(r){
  $('#toast').classList.remove('show');
  let corpo;
  if(r.erro){
    corpo = `<h2>Não foi possível importar</h2><p style="line-height:1.45">${esc(r.erro)}</p>`;
  } else if(r.linkRede){
    corpo = `<h2>Esse arquivo é só um link</h2>
      <p style="line-height:1.45">Ele foi exportado com a opção de link de rede, então não traz os pontos dentro dele.</p>
      <p style="line-height:1.45">Exporte de novo no My Maps: menu ⋮ ao lado do nome do mapa, "Exportar para KML/KMZ", <b>desmarque</b> "Manter os dados atualizados com link de rede KML" e <b>marque</b> "Exportar para um arquivo .KML".</p>`;
  } else if(!r.total){
    corpo = `<h2>Nenhum ponto encontrado</h2><p style="line-height:1.45">O arquivo abriu, mas não tem marcadores dentro. Confira se escolheu o mapa certo no My Maps e se a opção "Todo o mapa" estava selecionada na exportação.</p>`;
  } else {
    const partes = [];
    if(r.repetidos) partes.push(`${r.repetidos} já estava${r.repetidos===1?'':'m'} no mapa`);
    if(r.lugares) partes.push(`${r.lugares} ${r.lugares===1?'era lugar (hotel, restaurante, posto ou casa) e entrou':'eram lugares (hotel, restaurante, posto ou casa) e entraram'} em Lugares`);
    if(r.semPonto) partes.push(`${r.semPonto} ${r.semPonto===1?'era linha ou área':'eram linhas ou áreas'} e ${r.semPonto===1?'foi ignorada':'foram ignoradas'}`);
    corpo = `<h2>${r.novos} cliente${r.novos===1?'':'s'} importado${r.novos===1?'':'s'}</h2>
      <p class="muted" style="line-height:1.45">${r.total} marcador${r.total===1?'':'es'} no arquivo${partes.length?'. '+partes.join('; '):''}.</p>
      <p style="line-height:1.45">Todos entram como "Não visitado". Toque em cada um para registrar visitas e mudar a situação.</p>`;
  }
  abrirPainel(corpo + `<p class="muted" style="font-size:13px;margin-top:14px">Arquivo: ${esc(r.arquivo||'')}</p>
    <button class="btn primary block" id="rOk" style="margin-top:8px">Ver no mapa</button>`);
  $('#rOk').onclick = fecharPainel;
}

/* ================= Restaurar backup ================= */
$('#fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    const lista = Array.isArray(j) ? j : j.clientes;
    if(!Array.isArray(lista)) throw 0;
    if(clientes.length && !await confirmar(`Substituir os ${clientes.length} clientes atuais pelos ${lista.length} do backup?${nuvem.usuario ? '\n\nVocê está conectado à nuvem: ela também vai ficar igual a este backup.' : ''}`)) return;
    // Identificadores vão para atributos do HTML: um backup adulterado poderia esconder código neles.
    // Só passam letras, números, "-" e "_"; o resto ganha um identificador novo.
    const idOk = x => typeof x === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(x);
    const limparId = o => ({...o, id: idOk(o.id) ? o.id : uid()});
    clientes = lista.filter(c => c && isFinite(c.lat) && isFinite(c.lng) && c.nome).map(c => migrar({visitas:[], status:'nao', ...limparId(c)}));
    if(j.rotas && typeof j.rotas === 'object'){
      if(j.rotas.rotas && typeof j.rotas.rotas === 'object') j.rotas.rotas = Object.fromEntries(Object.entries(j.rotas.rotas).filter(([k]) => /^\d{4}-\d{2}-\d{2}$/.test(k)));

    }

/* ================= Nuvem (Supabase): login e sincronização ================= */
// Os dados continuam guardados no aparelho e o app funciona sem internet. Com login, cada alteração
// vai para a tabela "registros" do Supabase (um item por linha) e o que mudou em outro aparelho volta.
// Conflito: vale a última alteração sincronizada. No primeiro login de um aparelho, vale o que já está na nuvem.
const SUPA_URL = 'https://ykoafbzhqfmnothsybyp.supabase.co';
const SUPA_KEY = 'sb_publishable_27SCZQz24VYNuQ9zyHaIOw_YjEtO_ic';
const KEY_N = 'mapaClientes.nuvem.v1';
// var (e não let): salvar() pode ser chamado antes desta parte do código rodar
var nuvem = {sb:null, usuario:null, estado:'desligada', rodando:false, deNovo:false, aplicando:false, tEnvio:null, ultimaVez:null, erro:''};
try{ if(SUPA_URL && window.supabase) nuvem.sb = supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}

function lerN(){ try{ return JSON.parse(localStorage.getItem(KEY_N)) || {}; }catch(e){ return {}; } }
function gravarN(s){ try{ localStorage.setItem(KEY_N, JSON.stringify(s)); }catch(e){} }

// Impressão digital curta de um item, para saber se ele mudou desde a última sincronização
// O Postgres (jsonb) reordena os campos ao guardar, então a comparação ignora a ordem
const ordenado = v => Array.isArray(v) ? v.map(ordenado) : (v && typeof v==='object') ? Object.keys(v).sort().reduce((o,k) => (o[k] = ordenado(v[k]), o), {}) : v;
function resumo(obj){
  const s = JSON.stringify(ordenado(obj)); let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1^c, 2654435761); h2 = Math.imul(h2^c, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909);
  h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36);
}
// Tudo o que vai para a nuvem, como "tipo|id" → dados (a viagem sendo gravada agora fica só no aparelho)
function itensLocais(){
  const m = new Map();
  clientes.forEach(c => m.set('cliente|'+c.id, c));
  hoteis.forEach(h => m.set('hotel|'+h.id, h));
  m.set('config|config', {casa:R.casa || null, destinoPadrao:R.destinoPadrao});
  Object.entries(R.rotas).forEach(([k,r]) => m.set('rota_dia|'+k, r));
  R.salvas.forEach(s => m.set('rota_salva|'+s.id, s));
  R.viagens.forEach(v => m.set('viagem|'+v.id, v));
  return m;
}
const separar = k => { const i = k.indexOf('|'); return [k.slice(0,i), k.slice(i+1)]; };
function aplicarRemoto(tipo, id, dados, apagado){
  const trocar = (lista, novo) => {
    const i = lista.findIndex(x => x.id===id);
    if(apagado){ if(i>=0) lista.splice(i,1); } else if(i>=0) lista[i] = novo; else lista.push(novo);
  };
  if(tipo==='cliente') trocar(clientes, apagado ? null : migrar(dados));
  else if(tipo==='hotel') trocar(hoteis, dados);
  else if(tipo==='rota_salva'){ trocar(R.salvas, dados); if(apagado && R.salvaVisivel===id) R.salvaVisivel = null; }
  else if(tipo==='viagem'){ trocar(R.viagens, dados); R.viagens.sort((a,b) => b.inicio.localeCompare(a.inicio)); }
  else if(tipo==='rota_dia'){ if(apagado) delete R.rotas[id]; else R.rotas[id] = dados; }
  else if(tipo==='config' && !apagado){ R.casa = dados.casa || null; if(dados.destinoPadrao) R.destinoPadrao = dados.destinoPadrao; }
}
// O que mudou no aparelho e ainda não foi para a nuvem
function pendentes(st){
  const h = st.h || {}, locais = itensLocais(), lista = [];
  locais.forEach((v,k) => { const r = resumo(v); if(r !== h[k]) lista.push({k, r, dados:v}); });
  Object.keys(h).forEach(k => { if(!locais.has(k)) lista.push({k, r:null, dados:null}); });
  return lista;
}

/* ---------- App aberto em mais de uma janela no mesmo aparelho ---------- */
// Aba do Chrome e ícone da tela inicial dividem a mesma memória do aparelho, mas cada janela
// guarda sua própria cópia dos dados. Uma janela esquecida aberta, com a cópia velha, devolvia
// clientes excluídos e apagava hotéis novos ao sincronizar. Por isso, cada janela relê os dados
// do aparelho quando outra grava, ao voltar para a tela e antes de sincronizar.
function relerDoAparelho(){
  let mudou = false;
  try{
    // Só relê o que outra janela gravou (diferente do que esta janela leu ou gravou por último)
    const c = localStorage.getItem(KEY), l = localStorage.getItem(KEY_L), r = localStorage.getItem(KEY_R);
    if(c !== null && c !== VISTO[KEY]){ clientes = carregar(); mudou = true; }
    if(l !== null && l !== VISTO[KEY_L]){ hoteis = JSON.parse(VISTO[KEY_L] = l); mudou = true; }
    if(r !== null && r !== VISTO[KEY_R]){
      VISTO[KEY_R] = r;
      // A viagem sendo gravada nesta janela tem pontos dos últimos segundos que ainda não foram gravados
      const gravando = (typeof watchId !== 'undefined' && watchId !== null) ? R.viagemAtiva : null;
      R = Object.assign(baseR(), JSON.parse(r));
      if(gravando) R.viagemAtiva = gravando;
      mudou = true;
    }
  }catch(e){}
  if(mudou){
    desenhar(); desenharSalvaVisivel();
    // Um painel aberto aponta para a cópia velha: fecha para não gravar em cima
    if(document.body.classList.contains('sheet-open')){ fecharPainel(); toast('Dados atualizados por outra janela do app'); }
  }
  return mudou;
}
let tReler;
window.addEventListener('storage', e => {
  if(e.key === null || [KEY, KEY_L, 'mapaClientes.rotas.v1'].includes(e.key)){ clearTimeout(tReler); tReler = setTimeout(relerDoAparelho, 200); }
});
window.addEventListener('pageshow', e => { if(e.persisted) relerDoAparelho(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') relerDoAparelho(); });

// Só uma janela sincroniza por vez (navigator.locks vale entre abas do mesmo site)
async function sincronizar(){
  if(navigator.locks) return navigator.locks.request('mapaClientes-sync', {ifAvailable:true}, lock => lock ? sincronizarAgora() : null);
  return sincronizarAgora();
}
async function sincronizarAgora(){
  if(!nuvem.sb || !nuvem.usuario) return null;
  if(!navigator.onLine){ marcarNuvem('offline'); return null; }
  if(nuvem.rodando){ nuvem.deNovo = true; return null; }
  nuvem.rodando = true; marcarNuvem('enviando');
  let recebidos = 0, enviados = 0;
  try{
    relerDoAparelho();
    const st = lerN();
    // Outra conta entrou neste aparelho: os dados guardados são da conta anterior e não podem subir para esta
    if(st.userId && st.userId !== nuvem.usuario.id){ await trocarDeConta(st); return null; }
    if(!st.userId){ st.userId = nuvem.usuario.id; st.ultimo = null; st.h = {}; }
    const h = st.h || (st.h = {}), primeira = !st.ultimo;

    // 1) Trazer da nuvem o que mudou (com 10 s de folga, repetir um item não faz mal)
    const locais = itensLocais();
    let maior = st.ultimo, mudou = false;
    for(let de=0;;de+=1000){
      let q = nuvem.sb.from('registros').select('tipo,id,dados,apagado,atualizado_em').order('atualizado_em').range(de, de+999);
      if(st.ultimo) q = q.gt('atualizado_em', new Date(new Date(st.ultimo).getTime()-10000).toISOString());
      const {data, error} = await q; if(error) throw error;
      for(const r of data){
        if(!maior || r.atualizado_em > maior) maior = r.atualizado_em;
        const k = r.tipo+'|'+r.id, local = locais.get(k);
        const remoto = r.apagado ? null : resumo(r.dados), doAparelho = local ? resumo(local) : null;
        if(doAparelho === remoto){ if(remoto) h[k] = remoto; else delete h[k]; continue; }
        // Mudou aqui desde a última sincronização: fica a versão do aparelho, que vai ser enviada logo abaixo
        if(!primeira && doAparelho !== (h[k] ?? null)) continue;
        aplicarRemoto(r.tipo, r.id, r.dados, r.apagado);
        if(remoto) h[k] = remoto; else delete h[k];
        mudou = true; recebidos++;
      }
      if(data.length < 1000) break;
    }
    if(mudou){
      nuvem.aplicando = true; salvar(); salvarL(); salvarR(); nuvem.aplicando = false;
      desenhar(); desenharSalvaVisivel();
      // Aparelho novo: fecha o aviso de "mapa vazio" e mostra o que chegou
      if($('#eImport') && document.body.classList.contains('sheet-open')){ fecharPainel(); if(clientes.length) enquadrar(clientes); }
    }

    // 2) Enviar o que mudou no aparelho (itens apagados vão marcados como apagados)
    const lista = pendentes(st);
    // Trava de segurança: apagar muitos itens de uma vez na nuvem só com confirmação.
    // Se a resposta for não, a próxima sincronização traz tudo de volta da nuvem para o aparelho.
    const apagando = lista.filter(p => !p.dados).length;
    if(apagando > 10 && !await confirmar(`A sincronização vai apagar ${apagando} itens também na nuvem (clientes, hotéis, rotas ou viagens).\n\nVocê apagou tudo isso de propósito?`, 'Sim, apagar', 'Não, trazer de volta')){
      st.ultimo = null; gravarN(st); nuvem.deNovo = true;
      throw new Error('exclusões canceladas; trazendo os dados de volta da nuvem');
    }
    for(let i=0;i<lista.length;i+=100){
      const lote = lista.slice(i, i+100);
      const linhas = lote.map(p => { const [tipo, id] = separar(p.k); return {user_id:nuvem.usuario.id, tipo, id, dados:p.dados, apagado:!p.dados}; });
      const {error} = await nuvem.sb.from('registros').upsert(linhas, {onConflict:'user_id,tipo,id'});
      if(error) throw error;
      lote.forEach(p => { if(p.r) h[p.k] = p.r; else delete h[p.k]; });
      enviados += lote.length;
      gravarN({...st, h});
    }
    st.ultimo = maior || st.ultimo || new Date(0).toISOString();
    gravarN(st);
    nuvem.ultimaVez = new Date(); nuvem.erro = '';
    marcarNuvem(pendentes(st).length ? 'pendente' : 'ok');
    try{ await enviarFotos(); }catch(e){ nuvem.avisoFotos = 'Fotos aguardando envio.'; }
  }catch(e){
    nuvem.erro = e && (e.message || e.error_description) || 'erro desconhecido';
    marcarNuvem(navigator.onLine ? 'erro' : 'offline');
    return null;
  }finally{
    nuvem.rodando = false;
    if(nuvem.deNovo){ nuvem.deNovo = false; setTimeout(sincronizar, 500); }
  }
  return {recebidos, enviados};
}

/* ================= Marcadores no mapa (MapLibre) ================= */
// Com 200+ clientes, marcadores como elementos da página andavam atrasados em relação às ruas ao
// arrastar. Aqui eles são camadas do próprio MapLibre: um desenho só, que se move junto.
// As gotas são as mesmas (svgGota), transformadas em imagens uma vez ao abrir o app.
const DPR_GL = 8; // imagens em 8x: a gota chega a ~2,6× (1,8 × 1,45) e o celular tem até 3 px por ponto
async function gerarImagensGL(){
  if(!usarGL) return;
  const lista = [];
  Object.entries(STATUS).forEach(([k,s]) => {
    lista.push(['c-'+k, svgGota(s.cor, mioloCliente(s.cor, false)), 26, 35]);
    lista.push(['p-'+k, svgGota(s.cor, mioloCliente(s.cor, true)), 26, 35]);
    lista.push(['c-'+k+'-r', svgGota(s.cor, mioloCliente(s.cor, false), false, BORDA_ROTA), 26, 35]);
    lista.push(['p-'+k+'-r', svgGota(s.cor, mioloCliente(s.cor, true), false, BORDA_ROTA), 26, 35]);
  });
  Object.keys(LUGAR).forEach(t => lista.push(['l-'+t, svgGota(LUGAR[t].cor, mioloLugar(t), true), 32, 43]));
  const imgs = {};
  await Promise.all(lista.map(([nome, svg, w, h]) => new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas'); cv.width = w*DPR_GL; cv.height = h*DPR_GL;
      const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, cv.width, cv.height);
      imgs[nome] = cx.getImageData(0, 0, cv.width, cv.height); ok();
    };
    im.onerror = () => ok();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
  })));
  GL.imagens = imgs;
  montarGL();
}

const tamanhoGL = (comFator) => ['step', ['zoom'], ...[escalaZoom(0), 12, escalaZoom(13), 14, escalaZoom(15)].map((v, i) =>

]});

function coresTextoGL(){ return (escuro() || GL.satelite) ? {'text-color':'#F2F5F8', 'text-halo-color':'rgba(12,19,27,.9)'} : {'text-color':'#14283B', 'text-halo-color':'#FFFFFF'}; }

// Onde o nome pode ficar em volta da gota, na ordem de preferência: à esquerda (pedido do usuário),
// à direita, em cima, embaixo. O mapa usa o primeiro lugar livre; se nenhum couber, esse nome some

// cabeça a `cab` px acima da ponta, meia largura `meia`, altura total `alt`, para o tamanho `s`.
const TAM_TEXTO = 12.5;
function lugaresDoNome(s, cab, meia, alt){
  const em = px => +(px / TAM_TEXTO).toFixed(2);
  const x = em(meia*s + 4), y = -em(cab*s);

function camadaSimbolos(id, tamanho, posNome){

function aplicarSatelite(){

    const antes = ['rota','clientes','lugares'].find(id => g.getLayer(id));
    if(!g.getLayer('satelite')) g.addLayer({id:'satelite', type:'raster', source:'esri'}, antes);
  } else if(g.getLayer('satelite')) g.removeLayer('satelite');
}
// Coloca imagens, fontes de dados e camadas (de novo após trocar o tema, que recarrega o estilo)
function montarGL(){
  if(!usarGL || !GL.imagens || !GL.estiloPronto) return;
  const g = glMapa;
  Object.entries(GL.imagens).forEach(([n, d]) => { if(!g.hasImage(n)) g.addImage(n, d, {pixelRatio:DPR_GL}); });
  aplicarSatelite();
  if(!g.getSource('rota')) g.addSource('rota', {type:'geojson', data:geoRota()});
  if(!g.getSource('clientes')) g.addSource('clientes', {type:'geojson', data:geoClientes()});
  if(!g.getSource('lugares')) g.addSource('lugares', {type:'geojson', data:geoLugares()});
  if(!g.getLayer('rota')) g.addLayer({id:'rota', type:'line', source:'rota', layout:{'line-cap':'round'},
    paint:{'line-color':escuro() ? '#8FB8FF' : '#14283B', 'line-width':3, 'line-opacity':.75, 'line-dasharray':[2, 2.6]}});
  // Nome à direita da cabeça da gota (a cabeça sobe com o tamanho da gota)
  if(!g.getLayer('clientes')) g.addLayer(camadaSimbolos('clientes', tamanhoComSelecao, nomeCliente));
  if(!g.getLayer('lugares')) g.addLayer(camadaSimbolos('lugares', tamanhoGL(false), nomeLugar));
}
// Atualiza os dados (filtro, busca, seleção, cadastro...) sem recriar as camadas
function atualizarGL(){
  if(!usarGL) return;
  if(!GL.estiloPronto || !glMapa.getSource('clientes')){ montarGL(); return; }
  glMapa.getSource('clientes').setData(geoClientes());
  glMapa.getSource('lugares').setData(geoLugares());
}
function linhaRotaGL(pontos){
  if(!usarGL) return;
  GL.rota = pontos;
  if(GL.estiloPronto && glMapa.getSource('rota')) glMapa.getSource('rota').setData(geoRota());
}
// Qual marcador (cliente ou lugar) está no ponto tocado. Conta direta pela posição de cada gota na
// tela (não depende do MapLibre já ter redesenhado depois de mover o mapa), com 6 px de folga.
// Com gotas sobrepostas (ficaram 80% maiores e se encostam), vale a que tem a CABEÇA mais perto do
// dedo, e não a desenhada por cima: senão o toque num cliente mexia no vizinho da rota (relato do
// usuário em 05/10/2026: "não consigo cancelar a seleção"). Empate: selecionado, da rota, mais ao sul.
function marcadorNoPonto(latlng){
  if(!usarGL || !GL.imagens) return null;
  const p = map.latLngToContainerPoint(latlng), z = map.getZoom();
  const esc = escalaZoom(z), naRota = idsNaRota();
  // Candidatos: {camada, props, lat, lng, largura, altura, cabeça acima da ponta, tamanho, prioridade}
  const cand = [
    ...geoLugares().features.map(f => ({camada:'lugares', props:f.properties, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0], w:32, h:43, cab:26, s:esc, pri:0})),
    ...clientes.filter(passaFiltro).map(c => ({camada:'clientes', props:{id:c.id}, lat:c.lat, lng:c.lng, w:26, h:35, cab:22, s:esc * fatorCliente(c, naRota), pri:(c.id===selId ? 2 : 0) + (naRota.has(c.id) ? 1 : 0)}))
  ].map(m => ({...m, t:map.latLngToContainerPoint([m.lat, m.lng])}));
  // Primeiro procura onde o dedo caiu exatamente; só se não achar, aceita 6 px de folga
  for(const folga of [0, 6]){
    const achado = cand
      .filter(m => Math.abs(p.x - m.t.x) <= m.w*m.s/2 + folga && p.y <= m.t.y + folga && p.y >= m.t.y - m.h*m.s - folga)
      .map(m => ({m, d:Math.hypot(p.x - m.t.x, p.y - (m.t.y - m.cab*m.s))}))
      .sort((a,b) => a.d - b.d || b.m.pri - a.m.pri || a.m.lat - b.m.lat)[0];
    if(achado) return {layer:{id:achado.m.camada}, properties:achado.m.props};
  }
  return null;
}
// No computador, o cursor vira "mãozinha" em cima de uma gota, para mostrar que dá para clicar
// (as gotas são desenho dentro do mapa, então o navegador não faz isso sozinho)
map.on('mousemove', e => $('#map').classList.toggle('sobre-gota', !!marcadorNoPonto(e.latlng)));

// Janela do próprio app no lugar do confirm() do navegador: o Chrome deixa o usuário bloquear
// as caixas de diálogo de um site, e aí toda exclusão era cancelada sem aviso.
function confirmar(msg, sim, nao){
  const d = $('#dialogo');
  $('#dlgTxt').textContent = msg;
  // O botão leva o verbo da pergunta ("Excluir", "Apagar"...) e fica vermelho quando apaga algo
  const verbo = (msg.match(/^(Excluir|Apagar|Descartar|Tirar|Substituir|Sair|Encerrar)/) || [])[1];
  const acao = sim || verbo || 'Confirmar';
  $('#dlgSim').textContent = acao;
  $('#dlgNao').textContent = nao || 'Cancelar';
  $('#dlgSim').className = 'btn grow ' + (/^(Excluir|Apagar|Descartar|Tirar|Substituir|Sim, apagar|Transformar)/.test(acao) ? 'perigo' : 'primary');
  d.classList.add('show');
  return new Promise(ok => {
    const fim = v => { d.classList.remove('show'); d.onclick = $('#dlgSim').onclick = $('#dlgNao').onclick = null; ok(v); };
    $('#dlgSim').onclick = () => fim(true);
    $('#dlgNao').onclick = () => fim(false);
    d.onclick = e => { if(e.target === d) fim(false); };
    setTimeout(() => $('#dlgNao').focus(), 50);
  });
}

/* =====================================================================
   ROTAS: rota de clientes (visitas do dia) e rota de viagem (gravada por GPS)
   ===================================================================== */
const KEY_R = 'mapaClientes.rotas.v1';
const baseR = () => ({casa:null, destinoPadrao:'Parauapebas', rotas:{}, viagens:[], viagemAtiva:null, salvas:[], salvaVisivel:null});
let R = (() => { try{ const v = JSON.parse(VISTO[KEY_R] = localStorage.getItem(KEY_R)); if(v && typeof v==='object') return Object.assign(baseR(), v); }catch(e){} return baseR(); })();
function salvarR(){
  try{ const s = JSON.stringify(R); localStorage.setItem(KEY_R, s); VISTO[KEY_R] = s; }
  catch(e){ toast('Memória do navegador cheia. Salve um backup e apague viagens antigas.'); }
  agendarEnvio(); // nuvem
}
// Data local AAAA-MM-DD (toISOString sozinho é UTC e vira o dia às 21h no Brasil)
const diaLocal = x => { const d = new Date(x); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const hojeKey = () => diaLocal(Date.now());
const fmtDia = k => { const [y,m,d] = k.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const cli = id => clientes.find(c=>c.id===id);
// Rota de visitas por dia (R.rotas['AAAA-MM-DD']). `diaRota` é o dia sendo visto/montado no painel:
// hoje por padrão, ou um dia futuro para planejar a semana. Dia que já passou volta a ser hoje.
let diaRota = null;
const diaSel = () => diaRota && diaRota > hojeKey() ? diaRota : hojeKey();
const ehHojeSel = () => diaSel() === hojeKey();
function rotaDoDia(criar, k){
  k = k || diaSel();
  if(!R.rotas[k] && criar) R.rotas[k] = {paradas:[], feitas:[]};
  const r = R.rotas[k];
  if(r){ r.paradas = r.paradas.filter(cli); r.feitas = r.feitas.filter(id=>r.paradas.includes(id)); }
  return r;
}
const rotaHoje = criar => rotaDoDia(criar, hojeKey()); // registrar visita sempre marca a rota de hoje
const DIAS_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const dataDe = k => new Date(k + 'T12:00:00');
// "hoje", "amanhã" ou "sex 03/10"
function rotuloDia(k){
  if(k === hojeKey()) return 'hoje';
  if(k === diaLocal(Date.now() + 864e5)) return 'amanhã';
  return `${DIAS_SEM[dataDe(k).getDay()].toLowerCase()} ${fmtDia(k).slice(0,5)}`;
}
const pontoInicio = () => minhaPos || (R.casa ? [R.casa.lat, R.casa.lng] : null);
// Para um dia futuro, a rota começa em casa (onde você está agora não importa)
const inicioDaRota = () => ehHojeSel() ? pontoInicio() : (R.casa ? [R.casa.lat, R.casa.lng] : minhaPos);
const dist = (a,b) => map.distance(a,b);
const fmtKm = km => km.toFixed(km < 10 ? 1 : 0).replace('.',',') + ' km';
function fmtDur(ms){
  const min = Math.round(ms/60000); if(min < 60) return `${min} min`;
  return `${Math.floor(min/60)} h ${String(min%60).padStart(2,'0')} min`;
}

// Douglas-Peucker: mantém só os pontos que mudam o desenho mais que `tol` metros.
// Numa reta de 5 km, 160 pontos viram 2. Os km já foram somados antes, com todos os pontos.
function simplificar(pts, tol=15){
  if(!pts || pts.length < 3) return pts || [];
  const kx = 111320*Math.cos(pts[0][0]*Math.PI/180), ky = 110540;
  const xy = pts.map(p => [p[1]*kx, p[0]*ky]);
  const manter = new Uint8Array(pts.length); manter[0] = manter[pts.length-1] = 1;
  const pilha = [[0, pts.length-1]];
  while(pilha.length){
    const [a,b] = pilha.pop();
    const [ax,ay] = xy[a], dx = xy[b][0]-ax, dy = xy[b][1]-ay, L2 = dx*dx+dy*dy;
    let md = 0, mi = -1;
    for(let i=a+1;i<b;i++){
      let t = L2 ? ((xy[i][0]-ax)*dx + (xy[i][1]-ay)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(xy[i][0]-ax-t*dx, xy[i][1]-ay-t*dy);
      if(d > md){ md = d; mi = i; }
    }
    if(md > tol){ manter[mi] = 1; pilha.push([a,mi],[mi,b]); }
  }
  return pts.filter((_,i) => manter[i]);
}
// Viagens gravadas antes desta versão: simplifica uma vez só
if(!R.simplificado){
  R.viagens.forEach(v => { v.pontos = simplificar(v.pontos); });
  R.simplificado = 1; salvarR();
}

// Enquadra uma linha na parte do mapa que não está coberta pela barra de cima nem pelo painel de baixo
function enquadrarLinha(ll){
  seguirMinhaPos(false);
  const celular = innerWidth < 720 && document.body.classList.contains('sheet-open');
  const baixo = celular ? $('#sheet').offsetHeight + 20 : 50;
  const direita = !celular && document.body.classList.contains('sheet-open') ? 460 : 40;
  map.fitBounds(L.latLngBounds(ll), {paddingTopLeft:[40,130], paddingBottomRight:[direita, baixo]});
}

/* ---------- Desenho no mapa ---------- */
const camadaRota = L.layerGroup().addTo(map);
const camadaViagem = L.layerGroup().addTo(map);
let trilhaAtiva = null;

function desenharRota(){
  camadaRota.clearLayers();
  linhaRotaGL([]);
  atualizarAvisoDia();
  // Clientes da rota mostrada ficam maiores (fatorCliente): atualiza os marcadores
  if(usarGL) atualizarGL();
  else marcadores.forEach((m, id) => { const c = cli(id); if(c) m.setIcon(iconeDe(c)); });
  const r = rotaDoDia(false); if(!r || !r.paradas.length || rotaOculta) return;
  const cs = r.paradas.map(cli);
  const pend = cs.filter(c=>!r.feitas.includes(c.id));
  const linha = pend.map(c=>[c.lat,c.lng]);
  const ini = inicioDaRota(); if(ini && linha.length) linha.unshift(ini);
  // Com MapLibre, a linha vai dentro do mapa, por baixo das gotas
  if(linha.length > 1){
    if(usarGL) linhaRotaGL(linha);
    else L.polyline(linha, {color:escuro() ? '#8FB8FF' : '#14283B', weight:3, opacity:.75, dashArray:'7 8', interactive:false}).addTo(camadaRota);
  }
  cs.forEach((c,i) => L.marker([c.lat,c.lng], {
    icon:L.divIcon({className:'', html:`<div class="num${r.feitas.includes(c.id)?' ok':''}">${r.feitas.includes(c.id)?'✓':i+1}</div>`, iconSize:[20,20], iconAnchor:[-2,42]}),
    interactive:false, zIndexOffset:800
  }).addTo(camadaRota));
}

/* ---------- Rota de clientes ---------- */
// Aviso no mapa enquanto a rota mostrada é de outro dia (tocar volta para hoje)
function atualizarAvisoDia(){
  const el = $('#avisoDia'); if(!el) return;
  const outro = !ehHojeSel();
  const nParadas = (rotaDoDia(false)||{paradas:[]}).paradas.length;
  if(rotaOculta && nParadas){ el.classList.add('show'); $('#avisoDiaTxt').textContent = `Rota de ${rotuloDia(diaSel())} escondida · toque para mostrar`; return; }
  el.classList.toggle('show', outro);
  if(outro){ const n = (rotaDoDia(false)||{paradas:[]}).paradas.length; $('#avisoDiaTxt').textContent = `Rota de ${rotuloDia(diaSel())}${n ? ` (${n} parada${n===1?'':'s'})` : ''} · toque para voltar a hoje`; }
}
$('#avisoDia').onclick = () => {
  if(rotaOculta){ mostrarRota(true); if(document.body.classList.contains('sheet-open') && $('.dias')) abrirRotas('dia'); toast('Rota de volta no mapa'); return; }
  diaRota = null; desenharRota();
  if(document.body.classList.contains('sheet-open') && $('.dias')) abrirRotas('dia');
  toast('Mostrando a rota de hoje');
};
function alternarNaRota(id){
  const r = rotaDoDia(true);
  if(r.paradas.includes(id)){ r.paradas = r.paradas.filter(x=>x!==id); r.feitas = r.feitas.filter(x=>x!==id); }
  else r.paradas.push(id);
  rotaOculta = false; try{ localStorage.setItem('mapaClientes.rotaOculta', '0'); }catch(e){}
  salvarR(); desenharRota(); atualizarSelbar();
  return r.paradas.includes(id);
}
function marcarFeita(id){
  const r = rotaHoje(false);
  if(r && r.paradas.includes(id) && !r.feitas.includes(id)){ r.feitas.push(id); salvarR(); desenharRota(); }
}
function custo(ordem, ini){
  let t = 0, p = ini;
  ordem.forEach(id => { const c = cli(id); if(p) t += dist(p,[c.lat,c.lng]); p = [c.lat,c.lng]; });
  return t;
}
function otimizarRota(){
  const r = rotaDoDia(false); if(!r) return;
  const feitas = r.paradas.filter(id=>r.feitas.includes(id));
  let resto = r.paradas.filter(id=>!r.feitas.includes(id));
  const ini = inicioDaRota();
  // vizinho mais próximo
  const ordem = []; let p = ini || (resto.length ? [cli(resto[0]).lat, cli(resto[0]).lng] : null);
  while(resto.length){
    let m = 0, md = Infinity;
    resto.forEach((id,i) => { const c = cli(id); const d = dist(p,[c.lat,c.lng]); if(d < md){ md = d; m = i; } });
    const id = resto.splice(m,1)[0]; ordem.push(id); const c = cli(id); p = [c.lat,c.lng];
  }
  // melhoria 2-opt
  let melhorou = true, voltas = 0;
  while(melhorou && voltas++ < 50){
    melhorou = false;
    for(let i=0;i<ordem.length-1;i++) for(let k=i+1;k<ordem.length;k++){
      const nova = [...ordem.slice(0,i), ...ordem.slice(i,k+1).reverse(), ...ordem.slice(k+1)];
      if(custo(nova,ini) + 1 < custo(ordem,ini)){ ordem.splice(0, ordem.length, ...nova); melhorou = true; }
    }
  }
  r.paradas = [...feitas, ...ordem];
  salvarR(); desenharRota();
  const deCasa = R.casa && ini && ini[0] === R.casa.lat && ini[1] === R.casa.lng;
  toast(ini ? (deCasa ? 'Ordem ajustada a partir da sua casa' : 'Ordem ajustada a partir de onde você está') : 'Ordem ajustada');
}
function linksGoogle(){
  const r = rotaDoDia(false); if(!r) return [];
  const pend = r.paradas.filter(id=>!r.feitas.includes(id)).map(cli);
  const links = [];
  for(let i=0;i<pend.length;i+=10){
    const trecho = pend.slice(i,i+10);
    const destino = trecho[trecho.length-1];
    const meio = trecho.slice(0,-1).map(c=>`${c.lat},${c.lng}`).join('|');
    let u = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${destino.lat},${destino.lng}`;
    if(i>0){ const o = pend[i-1]; u += `&origin=${o.lat},${o.lng}`; }
    if(meio) u += `&waypoints=${encodeURIComponent(meio)}`;
    links.push({u, de:i+1, ate:i+trecho.length});
  }
  return links;
}

}

// Faixa com os próximos 7 dias (e o dia escolhido no calendário, se for depois disso).
// O número em cada dia é quantas paradas a rota daquele dia já tem.
function htmlDias(){
  const dias = Array.from({length:7}, (_, i) => diaLocal(Date.now() + i*864e5));
  if(!dias.includes(diaSel())) dias.push(diaSel());
  return `<div class="dias" role="group" aria-label="Dia da rota">${dias.map((k, i) => {
    const n = (R.rotas[k]?.paradas || []).filter(cli).length, d = dataDe(k);
    return `<button data-rt="dia" data-k="${k}" aria-pressed="${k===diaSel()}" aria-label="${esc(rotuloDia(k))}${n ? `, ${n} paradas` : ''}"><small>${i===0 ? 'Hoje' : DIAS_SEM[d.getDay()]}</small><b>${d.getDate()}</b>${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('')}<label class="cal" aria-label="Escolher outra data"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><small>Outro</small><input type="date" id="rDia" min="${hojeKey()}" value="${diaSel()}"></label></div>`;
}
function htmlDia(){
  const r = rotaDoDia(false), dia = rotuloDia(diaSel()), hoje = ehHojeSel();
  // Rotas de dias que já passaram, para copiar para o dia escolhido
  const hist = Object.keys(R.rotas).filter(k=>k<hojeKey() && R.rotas[k].paradas.length).sort().reverse().slice(0,10);
  const nFiltro = filtro!=='todos' ? clientes.filter(passaFiltro).length : 0;
  let h = htmlDias() + `<h2>Rota de ${dia} <span class="muted" style="font-weight:600;font-size:18px">${hoje ? fmtDia(hojeKey()) : (dia==='amanhã' ? fmtDia(diaSel()) : '')}</span></h2>`;

    h += `<p class="muted" style="margin:0 0 14px;line-height:1.45">${hoje ? 'Monte a sequência de clientes que você vai visitar hoje.' : `Planeje os clientes que vai visitar ${dia==='amanhã' ? 'amanhã' : 'em ' + dia}. A rota fica salva para o dia.`} Eles aparecem numerados no mapa.</p>
      <button class="btn primary block" data-rt="selecionar">Escolher clientes no mapa</button>
      ${nFiltro?`<button class="btn block" data-rt="filtro" style="margin-top:8px">Adicionar os ${nFiltro} do filtro atual</button>`:''}`;
  } else {

    const pend = cs.filter(c=>!r.feitas.includes(c.id));
    const km = custo(pend.map(c=>c.id), inicioDaRota())/1000;
    h += `<p class="muted" style="margin:0 0 10px">${r.feitas.length} de ${cs.length} visitadas${pend.length?`. Faltam cerca de ${fmtKm(km)} em linha reta`:''}.</p>
      <ol class="stops">${cs.map((c,i)=>{ const f = r.feitas.includes(c.id); const s = STATUS[c.status]||STATUS.nao;
        return `<li class="${f?'done':''}">
          <button class="chk" data-rt="feita" data-id="${c.id}" aria-label="${f?'Desmarcar':'Marcar como visitado'}">${f?'✓':i+1}</button>
          <button class="nmbtn" data-rt="abrir" data-id="${c.id}"><span class="nm"><span class="dot${ehP(c)?' p':''}" style="--c:${s.cor}"></span>${esc(c.nome)}</span><span class="sub">${s.label}</span></button>
          <span class="mv"><button data-rt="sobe" data-i="${i}" aria-label="Subir" ${i===0?'disabled':''}>▲</button><button data-rt="desce" data-i="${i}" aria-label="Descer" ${i===cs.length-1?'disabled':''}>▼</button><button data-rt="tirar" data-id="${c.id}" aria-label="Tirar da rota">×</button></span>
        </li>`; }).join('')}</ol>
      <div class="row" style="margin-top:12px">
        <button class="btn grow" data-rt="otimizar">Melhor ordem</button>
        <button class="btn grow" data-rt="selecionar">Incluir ou tirar</button>
      </div>
      <button class="btn block" data-rt="ocultarRota" style="margin-top:8px">${rotaOculta ? 'Mostrar a rota no mapa' : 'Esconder a rota do mapa'}</button>
      ${pend.length ? linksGoogle().map((l,j,arr)=>`<a class="btn dark block" style="margin-top:8px" href="${l.u}" target="_blank" rel="noopener">Abrir no Google Maps${arr.length>1?` (paradas ${l.de} a ${l.ate})`:''}</a>`).join('') : `<p class="ok-msg">Todas as visitas de ${dia} foram feitas.</p>`}
      <button class="btn danger block" data-rt="limpar" style="margin-top:8px">Apagar rota de ${dia}</button>`;
  }
  if(hist.length){
    h += `<h3>Rotas anteriores</h3><ul class="list">${hist.map(k=>{ const x = R.rotas[k];
      return `<li><button data-rt="repetir" data-k="${k}"><span><span class="nm">${DIAS_SEM[dataDe(k).getDay()]} ${fmtDia(k)}</span><span class="sub">${x.paradas.length} paradas, ${x.feitas.length} visitadas</span></span><span class="dist">Copiar para ${dia}</span></button></li>`; }).join('')}</ul>`;
  }
  return h;
}
// Trocar o dia da rota: mostra a rota daquele dia no mapa e enquadra as paradas
function escolherDia(k){
  diaRota = k > hojeKey() ? k : null;
  rotaOculta = false; try{ localStorage.setItem('mapaClientes.rotaOculta', '0'); }catch(e){}
  desenharRota(); abrirRotas('dia');
  const r = rotaDoDia(false);
  if(r && r.paradas.length) setTimeout(() => enquadrarLinha(r.paradas.map(cli).map(c => [c.lat, c.lng])), 0);
}

/* ---------- Rota de viagem ---------- */
let watchId = null, wakeLock = null, tSalvar = null, tRelogio = null;

function htmlViagem(){
  const v = R.viagemAtiva;
  const mes = hojeKey().slice(0,7);

      <p class="muted" style="font-size:14px;line-height:1.45;margin:10px 0">Deixe o app aberto e a tela ligada durante a viagem. Com a tela apagada o celular para de enviar a localização.</p>

      <button class="btn block" data-rt="manual" style="margin-top:8px">Registrar viagem já feita</button>
      <p class="muted" style="font-size:14px;margin:12px 0 0">Casa: ${R.casa?'marcada no mapa':'ainda não marcada'}. <button class="linkbtn" data-rt="casa">${R.casa?'Atualizar para onde estou':'Marcar onde estou agora'}</button></p>`;
  }
  h += `<h3>Viagens</h3>
    <div class="summary" style="grid-template-columns:repeat(2,1fr)"><div><b>${doMes.length}</b><span>viagens no mês</span></div><div><b>${fmtKm(kmMes)}</b><span>rodados no mês</span></div></div>`;

    h += `<ul class="list">${R.viagens.slice(0,30).map(x=>`<li><button data-rt="verViagem" data-id="${x.id}"><span><span class="nm">${esc(x.origem)} para ${esc(x.destino)}</span><span class="sub">${fmtData(x.inicio)}${x.fim?`, ${fmtDur(new Date(x.fim)-new Date(x.inicio))}`:''}${x.rotaId?', rota salva':x.manual?', registrada à mão':''}</span></span><span class="dist">${fmtKm(x.km)}</span></button></li>`).join('')}</ul>

function iniciarViagem(){
  if(!navigator.geolocation){ toast('Este navegador não oferece GPS.'); return; }
  const origem = $('#vgOrig').value.trim() || 'Casa', destino = $('#vgDest').value.trim() || 'Destino';
  R.destinoPadrao = destino;
  R.viagemAtiva = {id:uid(), origem, destino, inicio:new Date().toISOString(), pontos:[], km:0};
  salvarR(); ligarRastreio(); abrirRotas('viagem');
  toast('Gravando a viagem');
}
function ligarRastreio(){
  const v = R.viagemAtiva; if(!v || watchId!==null) return;
  camadaViagem.clearLayers();
  trilhaAtiva = L.polyline(v.pontos.map(p=>[p[0],p[1]]), {color:'#2563C9', weight:5, opacity:.85}).addTo(camadaViagem);
  watchId = navigator.geolocation.watchPosition(pos => {
    const v = R.viagemAtiva; if(!v) return;
    const c = pos.coords; if(c.accuracy > 60) return;
    const pt = [+c.latitude.toFixed(5), +c.longitude.toFixed(5), Date.now()];
    const ult = v.pontos[v.pontos.length-1];
    if(ult){
      const d = dist([ult[0],ult[1]],[pt[0],pt[1]]);
      if(d < 30) return;
      if(d / Math.max(1,(pt[2]-ult[2])/1000) > 70) return; // salto de GPS (mais de 250 km/h)
      v.km += d/1000;
    }
    v.pontos.push(pt);
    minhaPos = [pt[0],pt[1]]; mostrarMinhaPos();
    trilhaAtiva.addLatLng([pt[0],pt[1]]);
    clearTimeout(tSalvar); tSalvar = setTimeout(salvarR, 3000);
    atualizarAoVivo();
  }, err => {
    if(err.code===1) toast('Permita o acesso à localização para gravar a viagem.');
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  pedirTelaLigada();
  clearInterval(tRelogio); tRelogio = setInterval(atualizarAoVivo, 30000);
  atualizarAoVivo();
}
function desligarRastreio(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(tRelogio); clearTimeout(tSalvar);
  try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
  $('#trip').classList.remove('show');
}
async function pedirTelaLigada(){
  try{ if('wakeLock' in navigator && document.visibilityState==='visible') wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange', () => { if((R.viagemAtiva || seguindo) && document.visibilityState==='visible') pedirTelaLigada(); });
function atualizarAoVivo(){
  const v = R.viagemAtiva; if(!v) return;
  const km = fmtKm(v.km), t = fmtDur(Date.now()-new Date(v.inicio));
  $('#trip').classList.add('show');
  $('#tripTxt').textContent = `Gravando viagem: ${km} em ${t}`;
  const a = document.getElementById('lvKm'), b = document.getElementById('lvT');
  if(a) a.textContent = km; if(b) b.textContent = t;
}
function encerrarViagem(){
  const v = R.viagemAtiva; if(!v) return;
  v.fim = new Date().toISOString(); v.km = Math.round(v.km*10)/10;
  v.pontos = simplificar(v.pontos); // economiza memória; os km já estão somados
  R.viagens.unshift(v); R.viagemAtiva = null;
  desligarRastreio(); salvarR();
  mostrarViagem(v.id);
  toast(`Viagem salva: ${fmtKm(v.km)}`);
}
function mostrarViagem(id){
  const v = R.viagens.find(x=>x.id===id); if(!v) return;
  camadaViagem.clearLayers();
  if(v.pontos && v.pontos.length > 1){
    const ll = v.pontos.map(p=>[p[0],p[1]]);
    L.polyline(ll, {color:'#2563C9', weight:5, opacity:.85}).addTo(camadaViagem);
    L.circleMarker(ll[0], {radius:7, color:'#fff', weight:3, fillColor:'#1F9D55', fillOpacity:1}).addTo(camadaViagem);
    L.circleMarker(ll[ll.length-1], {radius:7, color:'#fff', weight:3, fillColor:'#C8372D', fillOpacity:1}).addTo(camadaViagem);
    setTimeout(() => enquadrarLinha(ll), 0);
  }
  abrirPainel(`<h2>${esc(v.origem)} para ${esc(v.destino)}</h2>
    <div class="live"><div><b>${fmtKm(v.km)}</b><span>percorridos</span></div><div><b>${v.fim?fmtDur(new Date(v.fim)-new Date(v.inicio)):'—'}</b><span>de viagem</span></div></div>
    <p class="muted">${v.manual ? fmtData(v.inicio) : new Date(v.inicio).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}${v.fim&&!v.manual?` até ${new Date(v.fim).toLocaleTimeString('pt-BR',{timeStyle:'short'})}`:''}${v.rotaId?'. Registrada com os km de uma rota salva.':v.manual?'. Registrada à mão, sem percurso no mapa.':'. Início em verde, chegada em vermelho.'}</p>
    <div class="row"><button class="btn grow" data-rt="aba" data-v="viagem">Voltar</button><button class="btn danger grow" data-rt="apagarViagem" data-id="${v.id}">Apagar viagem</button></div>`);
}

const camadaSalva = L.layerGroup().addTo(map);
const camadaDesenho = L.layerGroup().addTo(map);
const salva = id => R.salvas.find(x=>x.id===id);
const nomeSalva = s => `${s.origem} → ${s.destino}`;

/* ---------- Desenhar no mapa ---------- */
let desenho = null; // rota sendo desenhada: {id, origem, destino, apelido, marcos, tracado, km, min, porRua, req}
function iniciarDesenho(dados){
  desenho = {...dados, marcos:(dados.marcos||[]).map(p=>[...p]), tracado:(dados.tracado||[]).map(p=>[...p]), km:dados.km||0, min:dados.min||null, porRua:dados.porRua!==false, req:0};
  fecharPainel(); document.body.classList.add('desenhando');
  camadaSalva.clearLayers();
  if(desenho.marcos.length > 1) map.fitBounds(L.latLngBounds(linhaSalva(desenho)), {paddingTopLeft:[40,90], paddingBottomRight:[40,220]});
  else if(minhaPos) map.setView(minhaPos, 13);
  redesenharDesenho(); atualizarDrawbar();
}
function sairDesenho(){
  const id = desenho && desenho.id;
  desenho = null; document.body.classList.remove('desenhando'); camadaDesenho.clearLayers(); desenharSalvaVisivel();
  return id;
}
function redesenharDesenho(){
  camadaDesenho.clearLayers(); if(!desenho) return;
  if(desenho.tracado.length > 1) L.polyline(desenho.tracado, {color:COR_SALVA, weight:5, opacity:.85, interactive:false}).addTo(camadaDesenho);
  const n = desenho.marcos.length;
  desenho.marcos.forEach((p,i) => {
    const tipo = i===0 ? 'ini' : (i===n-1 ? 'fim' : 'via');
    const tam = tipo==='via' ? 16 : 22;
    const m = L.marker(p, {draggable:true, zIndexOffset:900, icon:L.divIcon({className:'', html:`<div class="marco ${tipo}"></div>`, iconSize:[tam,tam], iconAnchor:[tam/2,tam/2]})});
    m.on('dragend', () => { const ll = m.getLatLng(); desenho.marcos[i] = [+ll.lat.toFixed(5), +ll.lng.toFixed(5)]; tracar(); });
    m.addTo(camadaDesenho);
  });
}
function addMarco(lat, lng){
  if(!desenho) return;
  desenho.marcos.push([+lat.toFixed(5), +lng.toFixed(5)]); tracar();
}
// Traça pelas ruas com o OSRM (gratuito, sem chave). Sem internet, liga os pontos em linha reta.
async function tracar(){
  if(!desenho) return;
  const pts = desenho.marcos, meu = ++desenho.req;
  redesenharDesenho(); atualizarDrawbar();
  if(pts.length < 2){ desenho.tracado = pts.map(p=>[...p]); desenho.km = 0; desenho.min = null; redesenharDesenho(); atualizarDrawbar(); return; }
  $('#drawInfo').textContent = 'Traçando pelas ruas…';
  let ok = false;
  try{
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j = await r.json();
    if(!desenho || meu !== desenho.req) return; // chegou uma resposta mais nova
    const rt = j.code==='Ok' && j.routes && j.routes[0];
    if(rt){
      desenho.tracado = simplificar(rt.geometry.coordinates.map(c => [+c[1].toFixed(5), +c[0].toFixed(5)]), 5);
      desenho.km = Math.round(rt.distance/100)/10; desenho.min = Math.round(rt.duration/60); desenho.porRua = true; ok = true;
    }
  }catch(e){ if(!desenho || meu !== desenho.req) return; }
  if(!ok){
    let m = 0; for(let i=1;i<pts.length;i++) m += dist(pts[i-1], pts[i]);
    desenho.tracado = pts.map(p=>[...p]); desenho.km = Math.round(m/100)/10; desenho.min = null; desenho.porRua = false;
    toast('Não consegui traçar pelas ruas agora. Liguei os pontos em linha reta.');
  }
  redesenharDesenho(); atualizarDrawbar();
}
function atualizarDrawbar(){
  if(!desenho) return;
  const n = desenho.marcos.length;
  $('#drawTxt').textContent = n===0 ? 'Toque no mapa onde a rota começa.'
    : n===1 ? 'Agora toque nos pontos por onde quer passar e, por último, no destino.'
    : 'Cada toque leva a rota até ali. Arraste um ponto para ajustar.';
  $('#drawInfo').textContent = n>=2 ? `${fmtKm(desenho.km)}${desenho.min?`, cerca de ${fmtDur(desenho.min*60000)}`:', em linha reta'}` : '';
  $('#drawUndo').disabled = !n; $('#drawOk').disabled = n < 2;
}
function salvarDesenho(){
  const d = desenho; if(!d || d.marcos.length < 2) return;
  const dados = {origem:d.origem, destino:d.destino, apelido:d.apelido, marcos:d.marcos, tracado:d.tracado, km:d.km, min:d.min, porRua:d.porRua};
  let id = d.id;
  if(id && salva(id)) Object.assign(salva(id), dados);
  else { id = uid(); R.salvas.push({id, criadoEm:new Date().toISOString(), ...dados}); }
  R.destinoPadrao = d.destino; R.salvaVisivel = id; salvarR();
  sairDesenho(); verSalva(id); toast('Rota salva');
}
map.on('click', e => { if(desenho && !marcadorNoPonto(e.latlng)) addMarco(e.latlng.lat, e.latlng.lng); });
$('#drawUndo').onclick = () => { if(desenho && desenho.marcos.length){ desenho.marcos.pop(); tracar(); } };
$('#drawCancel').onclick = () => { const id = sairDesenho(); if(id && salva(id)) verSalva(id); else abrirRotas('salvas'); };
$('#drawOk').onclick = salvarDesenho;

/* ---------- Ver e acompanhar ---------- */
function desenharSalvaVisivel(){
  camadaSalva.clearLayers();
  const s = R.salvaVisivel && salva(R.salvaVisivel); if(!s) return null;
  const ll = linhaSalva(s);
  L.polyline(ll, {color:COR_SALVA, weight:6, opacity:.8, interactive:false}).addTo(camadaSalva);
  L.circleMarker(ll[0], {radius:7, color:'#fff', weight:3, fillColor:'#1F9D55', fillOpacity:1, interactive:false}).addTo(camadaSalva);
  L.circleMarker(ll[ll.length-1], {radius:7, color:'#fff', weight:3, fillColor:'#C8372D', fillOpacity:1, interactive:false}).addTo(camadaSalva);
  return ll;
}
function verSalva(id){
  const s = salva(id); if(!s){ abrirRotas('salvas'); return; }
  R.salvaVisivel = id; salvarR();
  const ll = desenharSalvaVisivel();
  if(ll && seguindo !== id) setTimeout(() => enquadrarLinha(ll), 0); // depois do painel abrir, para saber a altura dele
  const seg = seguindo === id;
  abrirPainel(`<h2>${esc(nomeSalva(s))}</h2>
    ${s.apelido?`<p class="muted" style="margin:0 0 4px">${esc(s.apelido)}</p>`:''}
    <div class="live"><div><b>${fmtKm(s.km)}</b><span>de percurso</span></div><div><b>${s.min?fmtDur(s.min*60000):'—'}</b><span>${s.min?'estimados':'em linha reta'}</span></div></div>
    <p class="muted" style="font-size:14px;margin:0 0 12px;line-height:1.45">${s.porRua?'Traçada pelas ruas.':'Ligada em linha reta porque não havia internet ao criar. Use "Editar caminho" para traçar de novo.'} Saída em verde, chegada em vermelho.</p>
    <button class="btn primary block" data-rt="${seg?'pararSeguir':'seguir'}" data-id="${esc(id)}">${seg?'Parar de acompanhar':'Acompanhar no mapa'}</button>
    <button class="btn block" data-rt="fizSalva" data-id="${esc(id)}" style="margin-top:8px">Fiz esta rota hoje</button>
    <div class="row" style="margin-top:8px"><button class="btn grow" data-rt="editarSalva" data-id="${esc(id)}">Editar caminho</button><button class="btn grow" data-rt="renomearSalva" data-id="${esc(id)}">Renomear</button></div>
    <div class="row" style="margin-top:8px"><button class="btn grow" data-rt="ocultarSalva">Tirar do mapa</button><button class="btn danger grow" data-rt="apagarSalva" data-id="${esc(id)}">Apagar rota</button></div>
    <button class="btn block" data-rt="aba" data-v="salvas" style="margin-top:8px">Voltar</button>`);
}

let seguindo = null, watchSeguir = null, arrastouEm = 0;
map.on('dragstart', () => { arrastouEm = Date.now(); });
function seguir(id){
  if(!navigator.geolocation){ toast('Este navegador não oferece GPS.'); return; }
  pararSeguir(true);
  seguindo = id; R.salvaVisivel = id; salvarR(); desenharSalvaVisivel();
  watchSeguir = navigator.geolocation.watchPosition(p => {
    if(p.coords.accuracy > 100) return;
    minhaPos = [p.coords.latitude, p.coords.longitude]; mostrarMinhaPos();
    // Se você mexeu no mapa, espera 15 s antes de voltar a centralizar em você
    if(Date.now() - arrastouEm > 15000) map.setView(minhaPos, Math.max(map.getZoom(), 14));
    atualizarSegue();
  }, err => { if(err.code===1) toast('Permita o acesso à localização para acompanhar a rota.'); },
  {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  pedirTelaLigada(); atualizarSegue(); fecharPainel();
  toast('Acompanhando a rota. Deixe a tela ligada.');
}
function pararSeguir(silencioso){
  if(watchSeguir !== null){ navigator.geolocation.clearWatch(watchSeguir); watchSeguir = null; }
  const estava = seguindo; seguindo = null; $('#segue').classList.remove('show');
  if(!R.viagemAtiva){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
  if(estava && !silencioso) toast('Parou de acompanhar');
}
// Quanto falta: projeta sua posição no trecho mais próximo e soma dali até o fim
function faltaNaRota(s){
  const ll = linhaSalva(s); if(!minhaPos || ll.length < 2) return null;
  const kx = 111320*Math.cos(minhaPos[0]*Math.PI/180), ky = 110540;
  const px = minhaPos[1]*kx, py = minhaPos[0]*ky;
  let melhor = {d:Infinity, i:0, t:0};
  for(let i=0;i<ll.length-1;i++){
    const ax = ll[i][1]*kx, ay = ll[i][0]*ky, dx = ll[i+1][1]*kx-ax, dy = ll[i+1][0]*ky-ay, L2 = dx*dx+dy*dy;
    let t = L2 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(px-ax-t*dx, py-ay-t*dy);
    if(d < melhor.d) melhor = {d, i, t};
  }
  let m = dist(ll[melhor.i], ll[melhor.i+1]) * (1-melhor.t);
  for(let i=melhor.i+1;i<ll.length-1;i++) m += dist(ll[i], ll[i+1]);
  return {km:m/1000, fora:melhor.d > 300};
}
function atualizarSegue(){
  const s = seguindo && salva(seguindo); if(!s){ $('#segue').classList.remove('show'); return; }
  const f = faltaNaRota(s);
  $('#segueTxt').textContent = !f ? `Acompanhando: ${nomeSalva(s)}`
    : f.fora ? 'Você está fora da rota' : f.km < .1 ? `Chegou em ${s.destino}` : `Faltam ${fmtKm(f.km)} até ${s.destino}`;
  $('#segue').classList.add('show');
}
$('#segue').onclick = () => { if(seguindo) verSalva(seguindo); };

/* ---------- Fiz esta rota hoje ---------- */
function formFizSalva(id){
  const sel = id || (R.salvas[0] && R.salvas[0].id);
  abrirPainel(`<h2>Fiz uma das minhas rotas</h2>
    <p class="muted" style="margin:0 0 4px;line-height:1.45">Registra a viagem com os km da rota salva, sem precisar gravar pelo GPS.</p>
    <label class="f">Rota<select class="inp" id="fzRota">${R.salvas.map(s => `<option value="${esc(s.id)}"${s.id===sel?' selected':''}>${esc(nomeSalva(s))}${s.apelido?` (${esc(s.apelido)})`:''}, ${fmtKm(s.km)}</option>`).join('')}</select></label>
    <label class="f">Data<input class="inp" id="fzData" type="date" value="${hojeKey()}" max="${hojeKey()}"></label>
    <label class="check"><input type="checkbox" id="fzVolta"> Ida e volta (conta os km em dobro)</label>
    <div class="row" style="margin-top:16px"><button class="btn grow" data-rt="aba" data-v="viagem">Cancelar</button><button class="btn primary grow" data-rt="salvarFiz">Registrar viagem</button></div>`);
}
function salvarFiz(){
  const s = salva($('#fzRota').value); if(!s) return;
  const volta = $('#fzVolta').checked, dia = $('#fzData').value || hojeKey();
  const km = Math.round(s.km*(volta?2:1)*10)/10;
  R.viagens.push({id:uid(), origem:s.origem, destino:s.destino+(volta?' (ida e volta)':''), inicio:new Date(dia+'T12:00:00').toISOString(), km, manual:true, rotaId:s.id, pontos:[]});
  R.viagens.sort((x,y)=>y.inicio.localeCompare(x.inicio));
  salvarR(); abrirRotas('viagem'); toast(`Viagem registrada: ${fmtKm(km)}`);
}

/* ---------- Cliques de Minhas rotas ---------- */
$('#sheetBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-rt]'); if(!b) return;
  const a = b.dataset.rt, id = b.dataset.id;
  if(a==='novaSalva') formSalva();
  if(a==='desenharNova') iniciarDesenho({id:null, ...lerNomeSalva()});
  if(a==='verSalva') verSalva(id);
  if(a==='renomearSalva') formSalva(id);
  if(a==='renomearOk'){ Object.assign(salva(id), lerNomeSalva()); salvarR(); verSalva(id); toast('Rota renomeada'); }
  if(a==='editarSalva'){ if(seguindo===id) pararSeguir(true); iniciarDesenho({...salva(id)}); }
  if(a==='seguir') seguir(id);
  if(a==='pararSeguir'){ pararSeguir(); verSalva(id); }
  if(a==='ocultarSalva'){ pararSeguir(true); R.salvaVisivel = null; salvarR(); camadaSalva.clearLayers(); abrirRotas('salvas'); }
  if(a==='apagarSalva' && await confirmar('Apagar esta rota? As viagens já registradas com ela continuam no histórico.')){
    if(seguindo===id) pararSeguir(true);
    R.salvas = R.salvas.filter(x=>x.id!==id);
    if(R.salvaVisivel===id){ R.salvaVisivel = null; camadaSalva.clearLayers(); }
    salvarR(); abrirRotas('salvas'); toast('Rota apagada');
  }
  if(a==='fizSalva') formFizSalva(id);
  if(a==='salvarFiz') salvarFiz();
});

/* ---------- Cliques do painel de rotas ---------- */
$('#sheetBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-rt]'); if(!b) return;
  const a = b.dataset.rt, r = rotaDoDia(false);
  if(a==='dia') escolherDia(b.dataset.k);
  if(a==='aba') abrirRotas(b.dataset.v);
  if(a==='selecionar') entrarSelecao();
  if(a==='filtro'){ const rr = rotaDoDia(true); clientes.filter(passaFiltro).forEach(c=>{ if(!rr.paradas.includes(c.id)) rr.paradas.push(c.id); }); salvarR(); otimizarRota(); abrirRotas('dia'); }
  if(a==='feita' && r){ const id = b.dataset.id; r.feitas = r.feitas.includes(id) ? r.feitas.filter(x=>x!==id) : [...r.feitas, id]; salvarR(); desenharRota(); abrirRotas('dia'); }
  if(a==='abrir') abrirDetalhe(b.dataset.id);
  if((a==='sobe'||a==='desce') && r){ const i = +b.dataset.i, j = a==='sobe' ? i-1 : i+1; [r.paradas[i], r.paradas[j]] = [r.paradas[j], r.paradas[i]]; salvarR(); desenharRota(); abrirRotas('dia'); }
  if(a==='tirar'){ alternarNaRota(b.dataset.id); abrirRotas('dia'); }
  if(a==='otimizar'){ otimizarRota(); abrirRotas('dia'); }
  if(a==='ocultarRota'){ const esconder = !rotaOculta; mostrarRota(!esconder); if(esconder){ fecharPainel(); toast('Rota escondida do mapa. Ela continua salva.'); } else abrirRotas('dia'); }
  if(a==='limpar' && await confirmar(`Apagar a rota de ${rotuloDia(diaSel())}?`)){ delete R.rotas[diaSel()]; salvarR(); desenharRota(); abrirRotas('dia'); }
  if(a==='repetir'){ const src = R.rotas[b.dataset.k]; const rr = rotaDoDia(true); rr.paradas = src.paradas.filter(cli); rr.feitas = []; salvarR(); desenharRota(); abrirRotas('dia'); toast(`Rota copiada para ${rotuloDia(diaSel())}`); }
  if(a==='iniciar') iniciarViagem();
  if(a==='encerrar' && await confirmar('Encerrar e salvar esta viagem?')) encerrarViagem();
  if(a==='descartar' && await confirmar('Descartar esta viagem? O percurso gravado será perdido.')){ R.viagemAtiva = null; desligarRastreio(); camadaViagem.clearLayers(); salvarR(); abrirRotas('viagem'); }
  if(a==='casa') pegarGPS(p => { R.casa = {lat:p.lat, lng:p.lng}; salvarR(); desenharRota(); desenharLugares(); abrirRotas('viagem'); toast('Casa marcada'); });
  if(a==='manual') formManual();
  if(a==='salvarManual'){
    const km = parseFloat(String($('#mKm').value).replace(',','.'));
    if(!(km>0)){ toast('Informe os quilômetros rodados'); return; }
    const dia = $('#mData').value || hojeKey();
    R.viagens.push({id:uid(), origem:$('#mOrig').value.trim()||'Casa', destino:$('#mDest').value.trim()||'Destino', inicio:new Date(dia+'T12:00:00').toISOString(), km:Math.round(km*10)/10, manual:true, pontos:[]});
    R.viagens.sort((x,y)=>y.inicio.localeCompare(x.inicio));
    salvarR(); abrirRotas('viagem'); toast('Viagem registrada');
  }
  if(a==='verViagem') mostrarViagem(b.dataset.id);
  if(a==='apagarViagem' && await confirmar('Apagar esta viagem?')){ R.viagens = R.viagens.filter(x=>x.id!==b.dataset.id); camadaViagem.clearLayers(); salvarR(); abrirRotas('viagem'); }
  if(a==='csv') exportarCSV();
});
$('#routeBtn').onclick = () => abrirRotas();
$('#trip').onclick = () => abrirRotas('viagem');

// Viagem que estava sendo gravada quando o app foi fechado: retoma
if(R.viagemAtiva){ ligarRastreio(); setTimeout(()=>toast('Viagem em andamento retomada'), 800); }
desenharRota();
desenharSalvaVisivel();

/* ================= Início ================= */
// Service worker: só para o Chrome oferecer "Instalar app" (não guarda cache; veja sw.js)
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
aplicarTema();
gerarImagensGL();
desenhar();
// Visita que estava em andamento (ou esperando o resultado) quando o app foi fechado
if(va){ if(!cli(va.clienteId)){ va = null; salvarVA(); } else { atualizarFaixaVisita(); if(!va.fim) ligarLocalizacao(); } }
lembrarBackup();
avisarMemoria();
// Pede ao Chrome para não apagar os dados do app quando o celular estiver com pouco espaço
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
// Confere se o navegador está deixando guardar dados (aba anônima ou navegador de dentro do WhatsApp/Instagram não guardam)
function memoriaFunciona(){
  try{ localStorage.setItem('mapaClientes.teste', '1'); const ok = localStorage.getItem('mapaClientes.teste') === '1'; localStorage.removeItem('mapaClientes.teste'); return ok; }
  catch(e){ return false; }
}
const temAlgo = clientes.length || hoteis.length || R.casa || R.salvas.length || R.viagens.length;
if(!memoriaFunciona()){
  setTimeout(() => abrirPainel(`
    <h2>Este navegador não está guardando os dados</h2>
    <p style="line-height:1.45;margin:0 0 10px">Tudo o que você cadastrar aqui some quando fechar o app.</p>
    <p class="muted" style="line-height:1.45;margin:0 0 10px">Isso acontece em <b>aba anônima</b> e quando o site é aberto <b>de dentro do WhatsApp, Instagram ou Facebook</b>.</p>
    <p style="line-height:1.45;margin:0 0 14px">Abra o endereço direto no <b>Chrome</b>, numa aba normal, e adicione à tela inicial pelo menu ⋮.</p>
    <button class="btn block" data-l="fechar">Entendi</button>`), 300);
} else if(clientes.length) enquadrar(clientes);
else if(temAlgo) enquadrar([...hoteis, ...(R.casa ? [R.casa] : [])]);
else {
  setTimeout(() => abrirPainel(`
    <h2>Seu mapa ainda está vazio</h2>
    <p class="muted" style="margin:0 0 16px;line-height:1.45">Traga os clientes que você já tem no My Maps ou comece cadastrando o primeiro.</p>
    <button class="btn primary block" id="eImport">Importar do My Maps</button>
    <button class="btn block" id="eNovo" style="margin-top:8px">Cadastrar primeiro cliente</button>
    <p class="muted" style="font-size:13px;margin:14px 0 0;line-height:1.45">No My Maps: menu ⋮ ao lado do nome do mapa, "Exportar para KML/KMZ", marque "Exportar como KML" e salve o arquivo.</p>
  `), 300);
  document.addEventListener('click', e => {
    if(e.target.id==='eImport') $('#fileKml').click();
    if(e.target.id==='eNovo') $('#addBtn').click();
  });
}
</script>
