<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9" id="metaTema">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mapa de Clientes</title>
<!-- Instalar como app (manifest, ícones e sw.js ficam junto do index.html no site publicado) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script>
/* Tema: aplica antes de desenhar a página para não piscar branco no modo escuro */
(function(){
  var pref = 'auto'; try{ pref = localStorage.getItem('mapaClientes.tema') || 'auto'; }catch(e){}
  var escuro = pref==='escuro' || (pref==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
})();
/* Login obrigatório: sem sessão guardada, a tela de login já aparece no primeiro desenho da página.
   O link de "esqueci minha senha" volta para o app com os dados no endereço (#...type=recovery). */
var HASH_INICIAL = location.hash || '';
(function(){
  var tem = false;
  try{ for(var i=0;i<localStorage.length;i++){ if(/^sb-.*-auth-token$/.test(localStorage.key(i))) tem = true; } }catch(e){}
  if(!tem || /type=recovery|error=/.test(HASH_INICIAL)) document.documentElement.dataset.login = '1';
})();
</script>
<style>
/* ---------- Cores (tema claro) ---------- */
:root{
  --bg:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#F2F4F8;
  --glass:rgba(255,255,255,.96);
  --ink:#14283B;        /* azul-noite: texto */
  --ink-2:#5A6B7E;      /* texto secundário */
  --line:#E1E6EC;
  --go:#0E7A5F;         /* ação principal */
  --go-press:#0A5E49;
  --go-soft:#E2F3EE;
  --warn:#C8372D;
  --warn-line:#F1CFCB;
  --inv-bg:#14283B;     /* barras escuras (avisos, modo seleção) */
  --inv-fg:#FFFFFF;
  --tipo:#14283B;       /* bolinha do "P" nos filtros */
  --num-bg:#14283B; --num-fg:#FFFFFF;
  --pin-ring:#FFFFFF;
  --halo:#FFFFFF;       /* contorno do nome no mapa */
  --ok-bg:#E4F5EB; --ok-fg:#14532D;
  --scrim:rgba(12,22,34,.38);
  --map-bg:#EEF0F2;
  --focus:#3B82F6;
  --sh-1:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.08);
  --sh-2:0 12px 40px rgba(16,32,48,.20);
  --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
/* ---------- Cores (tema escuro) ---------- */
:root[data-tema="escuro"]{
  --bg:#0C131B;
  --surface:#16202B;
  --surface-2:#1F2B38;
  --glass:rgba(20,29,39,.96);
  --ink:#E8EEF5;
  --ink-2:#9DADBE;
  --line:#2B3949;
  --go:#18A882;
  --go-press:#12896A;
  --go-soft:rgba(24,168,130,.16);
  --warn:#F26B60;
  --warn-line:#5B2D2A;
  --inv-bg:#E8EEF5;
  --inv-fg:#0C131B;
  --tipo:#3D5064;
  --num-bg:#F2F5F8; --num-fg:#0C131B;
  --pin-ring:#FFFFFF;
  --halo:#0C131B;
  --ok-bg:rgba(31,157,85,.18); --ok-fg:#9BE3B7;
  --scrim:rgba(0,0,0,.55);
  --map-bg:#1E2833;
  --focus:#7FB0FF;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --sh-2:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important} /* o atributo hidden vale mesmo quando uma regra define display (a foto vazia aparecia como imagem quebrada) */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,a.btn{transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .15s}
button:active:not(:disabled),a.btn:active{transform:scale(.97)}
input[type=date]{color-scheme:inherit}

/* ---------- Barra superior ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 6px;pointer-events:none}
.top > *{pointer-events:auto}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--glass);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:0 6px 0 14px;height:52px;box-shadow:var(--sh-1)}
.search:focus-within{border-color:var(--go);box-shadow:var(--sh-1),0 0 0 3px var(--go-soft)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;border:0;outline:0;font:500 16px var(--sans);color:var(--ink);background:transparent;min-width:0}
.search input::placeholder{color:var(--ink-2)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:none;font-size:18px;color:var(--ink-2)}
.search.has .clear{display:grid;place-items:center}
.iconbtn{flex:none;width:52px;height:52px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;box-shadow:var(--sh-1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font:600 14px var(--sans);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.revisar{border-color:#D99A00}

/* ---------- Mapa ---------- */
#map{position:fixed;inset:0;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:var(--sans)}
.leaflet-control-attribution{font-size:10px}
:root[data-tema="escuro"] .leaflet-control-attribution{background:rgba(12,19,27,.7)!important;color:#9DADBE}
:root[data-tema="escuro"] .leaflet-control-attribution a{color:#BFD3EA}
/* Mapa reserva (OSM) não tem versão escura: escurece por filtro */
:root[data-tema="escuro"] #map.reserva .leaflet-tile-pane .osm{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
/* Marcadores em forma de gota (estilo Google Maps). A ponta fica no local exato. */
.pin{position:relative;width:26px;height:35px;transform-origin:50% 100%;transform:scale(calc(var(--esc,.8) * var(--f,1)));transition:transform .15s}
.pin.grande{width:32px;height:43px}
.pin svg.gota{display:block;overflow:visible}
.dot.p{position:relative}
.dot.p::after{content:"P";position:absolute;inset:0;display:grid;place-items:center;font:700 9px/1 var(--sans);color:#fff}
.list .dot.p{width:20px;height:20px}
.list .dot.p::after{font-size:11px}
.chip .dot.p{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--sans);padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);margin-left:6px}
.hist .res{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:14px;margin-bottom:2px}
.hist .res .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
/* .pin.sel: o tamanho vem de --f (fatorCliente) */
.pin.sel svg.gota{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 70%,transparent))}
/* Nome ao lado da cabeça da gota */
.pin .lbl{display:none;position:absolute;left:28px;top:13px;transform:translateY(-50%);white-space:nowrap;font:700 calc(13px / var(--esc,.8)) var(--cond);color:var(--ink);
  text-shadow:0 0 2px var(--halo),0 0 3px var(--halo);pointer-events:none}
#map.labels .pin .lbl{display:block}
.pin.grande .lbl{left:34px;top:16px}
/* Ícone pequeno de hotel/casa nas listas e filtros (quadrado arredondado) */
.lugar{position:relative;background:var(--c);border:2.5px solid #fff;display:grid;place-items:center}
.lugar.mini{flex:none;width:24px;height:24px;border-radius:7px;border-width:2px;box-shadow:none}
.lugar.mini::after{display:none}
.status svg{flex:none}
#sheetBody.eh-hotel .so-cliente{display:none}
.chip .lugar.mini{width:20px;height:20px;border-radius:6px;border-width:1.5px}
/* Ponto azul: o pulso anima só transform e opacity (a placa de vídeo faz, sem redesenhar a página) */
.me{position:relative;width:18px;height:18px;border-radius:50%;background:#2F7BF6;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.me::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:rgba(47,123,246,.35);z-index:-1;animation:pulso 2.4s ease-out infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.9}70%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}

/* ---------- Botões flutuantes ---------- */
.fabs{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:1000;display:flex;flex-direction:column;gap:12px;align-items:center}
.fabgroup{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.fab{width:52px;height:52px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.fabgroup .fab + .fab{border-top:1px solid var(--line)}
.fab.on{background:var(--inv-bg);color:var(--inv-fg)}
.fab.main{width:64px;height:64px;border-radius:20px;background:var(--go);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--go) 45%,transparent)}
.fab.main:active{background:var(--go-press)}

/* ---------- Modo "marcar no mapa" ---------- */
.cross{position:fixed;left:50%;top:50%;z-index:900;transform:translate(-50%,-100%);display:none;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.cross path{fill:var(--go)}
.pickbar,.selbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:1100;display:none;background:var(--inv-bg);color:var(--inv-fg);border-radius:var(--r-xl);padding:16px;box-shadow:var(--sh-2)}
.pickbar p,.selbar p{margin:0 0 12px;font-size:15px;line-height:1.35}
@media (min-width:720px){.pickbar,.selbar{left:50%;right:auto;width:440px;transform:translateX(-50%)}}
body.picking .cross,body.picking .pickbar{display:block}
body.picking .fabs,body.picking .chips{display:none}
body.selecting .selbar{display:block}
body.selecting .fabs{display:none}
.num{width:20px;height:20px;border-radius:50%;background:var(--num-bg);color:var(--num-fg);border:2px solid var(--pin-ring);display:grid;place-items:center;font:700 11px/1 var(--sans);box-shadow:0 1px 3px rgba(0,0,0,.35);transform:translate(calc((var(--esc,1) * 1.25 - 1) * 12px), calc((var(--esc,1) * 1.25 - 1) * -32px)) scale(1.2)} /* números da rota: andam até o canto da gota da rota (que tem 1,25 × --esc) sem crescer junto */
.num.ok{background:#1F9D55;color:#fff}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:var(--r-md);padding:4px;margin:4px 0 14px}
.tabs button{flex:1;height:42px;border:0;border-radius:10px;background:none;font:600 15px var(--sans);color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.stops{list-style:none;margin:0;padding:0}
.stops li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stops li:first-child{border-top:0}
.stops .chk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font:700 15px var(--sans)}
.stops li.done .chk{background:#1F9D55;border-color:#1F9D55;color:#fff}
.stops li.done .nm{text-decoration:line-through;color:var(--ink-2)}
.stops .nmbtn{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0}
.stops .nm{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px}
.stops .nm .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.stops .nm .dot.p{width:16px;height:16px}
.stops .sub{font-size:13px;color:var(--ink-2)}
.stops .mv{flex:none;display:flex;gap:3px}
.stops .mv button{width:34px;height:38px;border:0;background:var(--surface-2);border-radius:10px;font-size:13px;color:var(--ink-2)}
.stops .mv button:disabled{opacity:.3}
.ok-msg{margin:12px 0 0;padding:12px 14px;border-radius:var(--r-md);background:var(--ok-bg);color:var(--ok-fg);font-weight:600}
.live{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.live div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.live b{display:block;font:700 30px/1.05 var(--cond);font-variant-numeric:tabular-nums}
.live span{font-size:13px;color:var(--ink-2)}
.linkbtn{border:0;background:none;padding:0;color:var(--go);font:600 14px var(--sans);text-decoration:underline}
.trip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);z-index:1001;display:none;align-items:center;gap:8px;background:#2563C9;color:#fff;border:0;border-radius:999px;padding:10px 16px;font:600 14px var(--sans);box-shadow:0 6px 18px rgba(37,99,201,.45);white-space:nowrap}
.trip.show{display:flex}
.trip:active{transform:translateX(-50%) scale(.97)}
.trip i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pisca 1.4s infinite}
@keyframes pisca{50%{opacity:.25}}
body.picking .trip,body.selecting .trip{display:none}

/* ---------- Painel inferior ---------- */
.scrim{position:fixed;inset:0;z-index:1200;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1300;max-height:88%;display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-tema="escuro"] .sheet{border:1px solid var(--line);border-bottom:0}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
.sheet.arrastando{transition:none}
@media (min-width:720px){.sheet{left:auto;right:16px;bottom:16px;width:420px;border-radius:var(--r-xl);max-height:calc(100% - 32px)}
  :root[data-tema="escuro"] .sheet{border-bottom:1px solid var(--line)}}
.grip{flex:none;padding:10px 0 4px;touch-action:none;cursor:grab}
.grip::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-body{overflow-y:auto;padding:8px 18px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet h2{font:700 25px/1.15 var(--cond);margin:4px 0 6px;letter-spacing:.005em}
.sheet h3{font:700 13px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin:22px 0 8px}
.muted{color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:50px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);font:600 16px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--go);border-color:var(--go);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--go) 30%,transparent)}
.btn.primary:active{background:var(--go-press)}
.btn.dark{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.btn.danger{color:var(--warn);background:transparent;border-color:var(--warn-line)}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn.light{background:color-mix(in srgb,var(--inv-fg) 14%,transparent);border-color:color-mix(in srgb,var(--inv-fg) 28%,transparent);color:var(--inv-fg)}
.bigchoice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);margin-bottom:10px}
.bigchoice strong{display:block;font-size:17px}
.bigchoice span{font-size:14px;color:var(--ink-2)}
.bigchoice .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--go-soft);color:var(--go);display:grid;place-items:center}

label.f{display:block;margin:14px 0 0;font:600 14px var(--sans);color:var(--ink-2)}
.inp{display:block;width:100%;margin-top:6px;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);font:500 16px var(--sans);color:var(--ink);background:var(--surface-2)}
.inp:focus{outline:0;border-color:var(--go);box-shadow:0 0 0 3px var(--go-soft);background:var(--surface)}
.inp::placeholder{color:var(--ink-2);opacity:.8}
textarea.inp{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{display:flex;align-items:center;gap:6px;height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:600 14px var(--sans)}
.seg button .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}

.status{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--sans);padding:5px 11px 5px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.facts{margin:12px 0 4px;display:grid;gap:8px}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.35}
.fact svg{flex:none;margin-top:2px;opacity:.6}
.lastvisit{margin:14px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.lastvisit b{font-family:var(--cond);font-size:18px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.hist li:first-child{border-top:0}
.hist .when{flex:none;width:86px;font:600 14px var(--sans);color:var(--ink-2)}
.hist .what{flex:1;font-size:15px;line-height:1.4;white-space:pre-wrap}
.hist .x{border:0;background:none;color:var(--ink-2);font-size:18px;width:32px;height:32px;flex:none;border-radius:50%}

.list{list-style:none;margin:0;padding:0}
.list li button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;border-radius:0}
.list li:first-child button{border-top:0}
.list .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--pin-ring);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.list .nm{font-weight:600;font-size:16px;display:block}
.list .sub{font-size:14px;color:var(--ink-2)}
.list .dist{margin-left:auto;font:600 14px var(--cond);color:var(--ink-2);flex:none}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.summary div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.summary b{display:block;font:700 28px/1 var(--cond);font-variant-numeric:tabular-nums}
.summary span{font-size:13px;color:var(--ink-2)}
.menuitem{display:flex;width:100%;gap:14px;align-items:center;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:16px;font-weight:600}
.menuitem small{display:block;color:var(--ink-2);font-size:13px;font-weight:500}
.menuitem .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.empty{text-align:center;padding:24px 8px;color:var(--ink-2)}
.tema{display:flex;gap:4px;background:var(--surface-2);border-radius:var(--r-md);padding:4px;margin:6px 0 4px}
.tema button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border:0;border-radius:10px;background:none;font:600 14px var(--sans);color:var(--ink-2)}
.tema button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
/* ---------- Minhas rotas ---------- */
.drawbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:1100;display:none;background:var(--inv-bg);color:var(--inv-fg);border-radius:var(--r-xl);padding:16px;box-shadow:var(--sh-2)}
.drawbar p{margin:0 0 6px;font-size:15px;line-height:1.35}
.drawbar .info{font:700 20px var(--cond);margin:0 0 12px;min-height:1em}
.drawbar .info:empty{display:none}
.drawbar .btn:disabled{opacity:.4}
@media (min-width:720px){.drawbar{left:50%;right:auto;width:440px;transform:translateX(-50%)}}
body.desenhando .drawbar{display:block}
body.desenhando .fabs,body.desenhando .chips,body.desenhando .trip{display:none!important}
body.desenhando #map{cursor:crosshair}
#map.sobre-gota,#map.sobre-gota .leaflet-pane,#map.sobre-gota canvas{cursor:pointer!important} /* mouse em cima de uma gota desenhada no mapa */
.marco{width:100%;height:100%;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);background:#7C3AED;cursor:grab}
.marco.ini{background:#1F9D55}
.marco.fim{background:#C8372D}
.marco.via{border-width:2px}
.trip.segue{background:#7C3AED;box-shadow:0 6px 18px rgba(124,58,237,.45)}
.trip.show ~ .trip.segue{top:calc(env(safe-area-inset-top,0px) + 164px)}
.traco{flex:none;width:22px;height:5px;border-radius:3px;background:#7C3AED}
.tabs button{padding:0 4px;font-size:14px}
.check{display:flex;align-items:center;gap:10px;margin:16px 0 0;font:500 15px var(--sans)}
.check input{width:22px;height:22px;accent-color:var(--go);margin:0}
select.inp{appearance:auto;padding-right:8px}
/* ---------- Visita com cronômetro, fotos e relatório ---------- */
.trip.faixa-visita{background:var(--go);box-shadow:0 6px 18px color-mix(in srgb,var(--go) 45%,transparent);max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.trip.faixa-visita span{overflow:hidden;text-overflow:ellipsis}
.trip.show ~ .trip.faixa-visita,.trip.segue.show ~ .trip.faixa-visita{top:calc(env(safe-area-inset-top,0px) + 164px)}
.emvisita{display:flex;gap:12px;align-items:flex-start;margin:4px 0 10px;padding:12px 14px;border-radius:var(--r-md);background:var(--go-soft);border:1px solid color-mix(in srgb,var(--go) 40%,transparent);font-size:15px;line-height:1.4}
.emvisita small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.emvisita #vaTempo{font:700 17px var(--cond)}
.emvisita .pulso{flex:none;width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--go);animation:pisca 1.4s infinite}
.fachada{position:relative;margin:2px 0 12px;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.fachada img{display:block;width:100%;height:170px;object-fit:cover;cursor:zoom-in}
.fachada span{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 12px var(--sans)}
.foto-campo{margin-top:6px}
.foto-campo img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:var(--r-md);margin-bottom:8px}
.hist .when small{display:block;font-weight:500;font-size:12.5px}
.hist-foto{flex:none;width:52px;height:52px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.rel{list-style:none;margin:0;padding:0}
.rel li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rel li:first-child{border-top:0}
.rel-hora{flex:none;width:92px}
.rel-hora b{display:block;font:700 15px var(--cond)}
.rel-hora span{font-size:13px;color:var(--ink-2)}
.rel-info{flex:1;min-width:0}
.rel-nome{display:block;text-align:left;font-size:16px;color:var(--ink);text-decoration:none;margin-bottom:2px}
.rel-info .res{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:13.5px}
.rel-info .res .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.rel-info p{margin:4px 0 0;font-size:14px;line-height:1.4;white-space:pre-wrap;color:var(--ink-2)}
.rel-foto{flex:none;width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.visor{position:fixed;inset:0;z-index:3100;display:none;place-items:center;background:rgba(0,0,0,.9);padding:12px}
.visor.show{display:grid}
.visor img{max-width:100%;max-height:100%;border-radius:8px}
#impressao{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body > *:not(#impressao){display:none!important}
  #impressao{display:block!important;color:#111;font-family:Arial,sans-serif;padding:0 4mm}
  #impressao h1{font-size:20px;margin:0 0 2px}
  #impressao .imp-sub{margin:0 0 12px;color:#444;font-size:13px}
  .imp-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #ccc;break-inside:avoid}
  .imp-txt{flex:1;font-size:13px;line-height:1.4}
  .imp-txt b{font-size:14px}
  .imp-txt p{margin:4px 0 0;white-space:pre-wrap}
  .imp-end{color:#555}
  .imp-item img{width:46mm;height:34mm;object-fit:cover;border-radius:2mm}
}
/* ---------- Anotações, pendências e leitor de código ---------- */
.anotar{margin:0 0 10px;padding:10px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.anotar .btn{height:44px;padding:0 12px;font-size:15px}
.notas{list-style:none;margin:0 0 8px;padding:0}
.notas li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.notas span{flex:none;font:700 13px var(--cond);color:var(--ink-2);padding-top:2px}
.notas p{flex:1;margin:0;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.notas .x{border:0;background:none;color:var(--ink-2);font-size:18px;width:28px;height:28px;flex:none}
.aviso-pend{display:block;width:100%;text-align:left;margin:-4px 0 12px;padding:10px 14px;border-radius:var(--r-md);border:1px solid color-mix(in srgb,#D99A00 50%,transparent);background:color-mix(in srgb,#D99A00 15%,var(--surface));font:600 15px var(--sans);color:var(--ink)}
.qtd-pend{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:#D99A00;color:#fff;font:700 12px var(--sans);letter-spacing:0;vertical-align:1px}
.pend{list-style:none;margin:0 0 6px;padding:0}
.pend li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.pend li:first-child{border-top:0}
.pend p{margin:0;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.pend small{color:var(--ink-2);font-size:12.5px}
.pend div{flex:1;min-width:0}
.pend li.feita p{text-decoration:line-through;color:var(--ink-2)}
.pchk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #D99A00;background:var(--surface);display:grid;place-items:center;font:700 15px var(--sans);color:#fff}
.pchk.ok{background:#1F9D55;border-color:#1F9D55}
.pend .x{border:0;background:none;color:var(--ink-2);font-size:18px;width:28px;height:28px;flex:none}
#novaPend{margin:4px 0 8px}
#novaPend .btn{height:44px;font-size:15px}
.pend-feitas{margin-top:6px}
.pend-feitas summary{cursor:pointer;color:var(--ink-2);font:600 14px var(--sans);padding:6px 0}
.leitor{position:fixed;inset:0;z-index:3200;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px);background:#000;color:#fff}
.leitor.show{display:flex}
.leitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leitor .mira{position:absolute;left:50%;top:42%;width:min(78vw,340px);height:140px;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.leitor p,.leitor .btn{position:relative;z-index:1;margin:0}
.leitor p{font:600 16px var(--sans);text-shadow:0 1px 3px #000}
.leitor .btn{min-width:200px;--inv-fg:#fff}
@media print{ .imp-h2{font-size:16px;margin:16px 0 6px} .imp-pend{font-size:13px;padding:3px 0} }
/* ---------- Desfazer ---------- */
.desfazer{position:fixed;left:12px;right:92px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:2100;display:none;align-items:center;gap:12px;background:var(--inv-bg);color:var(--inv-fg);border-radius:var(--r-md);padding:8px 8px 8px 16px;box-shadow:var(--sh-2);font:600 15px var(--sans)}
.desfazer.show{display:flex}
.desfazer span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desfazer button{flex:none;height:42px;padding:0 16px;border:0;border-radius:10px;background:color-mix(in srgb,var(--go) 85%,#fff);color:#fff;font:700 15px var(--sans)}
@media (min-width:720px){.desfazer{left:50%;right:auto;width:420px;transform:translateX(-50%)}}
/* ---------- Rota por data ---------- */
.dias{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 12px;padding:2px}
.dias::-webkit-scrollbar{display:none}
.dias button,.dias .cal{flex:none;position:relative;width:52px;height:60px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.dias small{font:600 12px var(--sans);color:var(--ink-2)}
.dias b{font:700 20px/1 var(--cond)}
.dias i{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--go);color:#fff;font:700 11px/19px var(--sans);font-style:normal;text-align:center;border:2px solid var(--surface)}
.dias button[aria-pressed="true"]{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.dias button[aria-pressed="true"] small{color:inherit;opacity:.75}
.dias .cal{cursor:pointer;color:var(--ink-2)}
.dias .cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.aviso-dia{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:1001;display:none;align-items:center;gap:8px;max-width:calc(100% - 110px);background:var(--inv-bg);color:var(--inv-fg);border:0;border-radius:999px;padding:10px 14px;font:600 14px var(--sans);box-shadow:var(--sh-2);text-align:left}
.aviso-dia.show{display:flex}
body.picking .aviso-dia,body.selecting .aviso-dia,body.desenhando .aviso-dia{display:none}
/* ---------- Confirmação ---------- */
.dialogo{position:fixed;inset:0;z-index:3000;display:none;place-items:center;padding:16px;background:var(--scrim)}
.dialogo.show{display:grid}
.dialogo .caixa{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;box-shadow:var(--sh-2)}
.dialogo p{margin:0 0 18px;font-size:17px;line-height:1.45;white-space:pre-line}
.btn.perigo{background:var(--warn);border-color:var(--warn);color:#fff}
/* ---------- Nuvem ---------- */
.nuvem{margin:4px 0 6px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:15px;line-height:1.4}
.nuvem b{display:block}
.nuvem span{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.nuvem.on{border-color:color-mix(in srgb,var(--go) 45%,transparent);background:var(--go-soft)}
#menuBtn{position:relative}
#menuBtn::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);display:none}
#menuBtn[data-nuvem="ok"]::after{display:block;background:#1F9D55}
#menuBtn[data-nuvem="pendente"]::after,#menuBtn[data-nuvem="enviando"]::after{display:block;background:#D99A00}
#menuBtn[data-nuvem="offline"]::after{display:block;background:#8A94A3}
#menuBtn[data-nuvem="erro"]::after{display:block;background:#C8372D}
.aviso{margin:4px 0 6px;padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,#D99A00 16%,var(--surface));border:1px solid color-mix(in srgb,#D99A00 45%,transparent);font-size:15px;line-height:1.4}
.memoria{margin:14px 0 0;font-size:13px;color:var(--ink-2)}
.memoria .barra{height:6px;margin-top:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.memoria i{display:block;height:100%;background:var(--go)}
.memoria.alta i{background:var(--warn)}
:root[data-tema="escuro"] .tema button[aria-pressed="true"],:root[data-tema="escuro"] .tabs button[aria-selected="true"]{background:#34475C}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translate(-50%,-20px);z-index:2000;background:var(--inv-bg);color:var(--inv-fg);padding:12px 18px;border-radius:var(--r-md);font-weight:600;font-size:15px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;box-shadow:var(--sh-2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Tela de login (cobre o app até entrar) ---------- */
.login{position:fixed;inset:0;z-index:2500;display:none;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
:root[data-login] .login{display:flex}
.login-card{margin:auto;width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px 22px 22px;box-shadow:var(--sh-1)}
.login-logo{width:64px;height:64px;border-radius:18px;background:var(--go);display:grid;place-items:center;margin:0 auto 14px}
.login-card h1{margin:0;text-align:center;font:700 26px var(--cond);color:var(--ink)}
.login-card .sub{margin:6px 0 4px;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.4}
.login .senha{position:relative;display:block}
.login .senha .inp{padding-right:54px}
.login .senha button{position:absolute;right:2px;top:8px;width:48px;height:46px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;border-radius:var(--r-sm)}
.login-msg{margin:12px 0 0;font:600 14px var(--sans);line-height:1.4;color:var(--warn);min-height:0}
.login-msg.ok{color:var(--ok-fg);background:var(--ok-bg);padding:10px 12px;border-radius:var(--r-sm)}
.login-msg:empty,.login [hidden]{display:none!important}
.login-card .btn.primary{margin-top:18px}
.login-link{display:block;width:100%;margin-top:8px;height:48px;border:0;background:none;color:var(--ink-2);font:600 15px var(--sans);text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="loginTit">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.800 7-13a7 7 0 0 0-7-7zm0 9.600A2.600 2.600 0 1 1 12 6.400a2.600 2.600 0 0 1 0 5.200z"/></svg></div>
    <h1 id="loginTit">Mapa de Clientes</h1>
    <p class="sub" id="loginSub"></p>
    <label class="f" id="loginLEmail">E-mail<input class="inp" id="nEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="f" id="loginLSenha"><span id="loginRotSenha">Senha</span><span class="senha"><input class="inp" id="nSenha" type="password" autocomplete="current-password"><button type="button" id="verSenha" aria-label="Mostrar a senha" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="verSenhaRisco" d="M4 4l16 16" style="display:none"/></svg></button></span></label>
    <p class="login-msg" id="loginMsg" role="alert"></p>
    <button class="btn primary block" id="loginOk" type="submit">Entrar</button>
    <button class="login-link" id="loginLink" type="button">Esqueci minha senha</button>
  </form>
</div>

<div id="map" aria-label="Mapa de clientes"></div>

<div class="top">
  <div class="searchrow">
    <div class="search" id="searchBox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar cliente ou endereço" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" aria-label="Limpar busca">×</button>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filtrar clientes"></div>
</div>

<div class="fabs">
  <div class="fabgroup">
    <button class="fab" id="layerBtn" aria-label="Alternar mapa limpo e satélite">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button class="fab" id="routeBtn" aria-label="Rotas">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>
    </button>
    <button class="fab" id="listBtn" aria-label="Lista de clientes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="fabgroup">
    <button class="fab" id="locBtn" aria-label="Minha localização">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>

  </div>
  <button class="fab main" id="addBtn" aria-label="Adicionar cliente">

<svg class="cross" width="44" height="56" viewBox="0 0 44 56" aria-hidden="true">
  <path d="M22 54C22 54 40 33 40 20A18 18 0 0 0 4 20c0 13 18 34 18 34Z" stroke="#fff" stroke-width="3"/>
  <circle cx="22" cy="20" r="6" fill="#fff"/>
</svg>
<div class="pickbar" role="dialog" aria-label="Marcar local no mapa">
  <p id="pickTxt">Arraste o mapa até o pino ficar em cima do cliente.</p>
  <div class="row">
    <button class="btn light grow" id="pickCancel">Cancelar</button>
    <button class="btn primary grow" id="pickOk">Usar este local</button>

<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* ================= Erros visíveis ================= */
window.addEventListener('error', e => { const t=document.getElementById('toast'); if(t){ t.textContent='Erro: '+(e.message||'desconhecido'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),6000);} });

/* ================= Dados ================= */
const KEY = 'mapaClientes.v1';
// O que esta janela leu ou gravou por último em cada chave. Se o aparelho tiver outra coisa, foi outra janela do app
var VISTO = {};
// Cor da bolinha = situação. Letra P dentro = prospecção.
const STATUS = {
  nao:         {label:'Não visitado',  cor:'#8A94A3'},
  comprou:     {label:'Comprou',       cor:'#1F9D55'},
  nao_comprou: {label:'Não comprou',   cor:'#D99A00'},
  retornar:    {label:'Retornar',      cor:'#2563C9'},
  sem:         {label:'Sem interesse', cor:'#C8372D'}
};
const RESULTADOS = ['comprou','nao_comprou','retornar','sem']; // opções ao registrar visita
const TIPOS = {prospect:'Prospecção', cliente:'Cliente da carteira'};
const DIAS_ATRASO = 30;

let clientes = carregar();
// Filtro do topo: o app abre com o último usado (gravado em desenharChips)
const KEY_FILTRO = 'mapaClientes.filtro';
let filtro = (() => {
  try{ const f = localStorage.getItem(KEY_FILTRO); return ['todos','lugares','prospect','atraso', ...Object.keys(STATUS)].includes(f) ? f : 'todos'; }
  catch(e){ return 'todos'; }
})();
let busca = '';
let selId = null;
let minhaPos = null;

function carregar(){
  try { const v = JSON.parse(VISTO[KEY] = localStorage.getItem(KEY)); return Array.isArray(v) ? v.map(migrar) : []; }
  catch(e){ return []; }
}
// Versões anteriores tinham "Cliente ativo" e "Visitado"
function migrar(c){
  if(c.status==='ativo') c.status = 'comprou';
  if(!c.tipo) c.tipo = 'cliente';
  return c;
}
const ehP = c => c.tipo === 'prospect';
function salvar(){
  try { const s = JSON.stringify(clientes); localStorage.setItem(KEY, s); VISTO[KEY] = s; }
  catch(e){ toast('Não consegui salvar neste navegador. Faça um backup pelo menu.'); }
  agendarEnvio(); // nuvem
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function ultimaVisita(c){
  if(!c.visitas || !c.visitas.length) return null;
  return c.visitas.reduce((a,v)=> v.data > a ? v.data : a, c.visitas[0].data);
}
function diasDesde(iso){
  if(!iso) return null;
  const d = new Date(iso); d.setHours(0,0,0,0);
  const h = new Date(); h.setHours(0,0,0,0);
  return Math.round((h - d)/86400000);
}
function textoDias(n){
  if(n === null) return 'Nunca visitado';
  if(n === 0) return 'Visitado hoje';
  if(n === 1) return 'Visitado ontem';
  return `Visitado há ${n} dias`;
}
const fmtData = iso => new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
function distKm(c){
  if(!minhaPos) return null;
  return map.distance([c.lat,c.lng], minhaPos)/1000;
}
function fmtDist(km){ if(km===null) return ''; return km < 1 ? Math.round(km*1000)+' m' : km.toFixed(km<10?1:0).replace('.',',')+' km'; }

function atrasado(c){
  const d = diasDesde(ultimaVisita(c));
  return d !== null && d >= DIAS_ATRASO;
}
// Minúsculas e sem acento: "joao" acha "João", "acai" acha "Açaí"
const normal = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function passaFiltro(c){
  if(busca){
    const t = normal(c.nome+' '+(c.responsavel||'')+' '+(c.endereco||'')+' '+(c.obs||''));
    if(!t.includes(busca)) return false;
  }
  if(filtro === 'todos') return true;
  if(filtro === 'lugares') return false; // só hotéis e casa no mapa
  if(filtro === 'atraso') return atrasado(c);
  if(filtro === 'prospect') return ehP(c);
  return c.status === filtro;
}

/* ================= Mapa ================= */
const map = L.map('map', {zoomControl:false, attributionControl:true, minZoom:3, maxZoom:20,
  maxBounds:[[85,-180],[-85,180]], maxBoundsViscosity:1}).setView([-14.2,-51.9], 4);
// Mapa limpo: estilos Positron (claro) e Dark (escuro) do OpenFreeMap (gratuitos, sem chave, sem estabelecimentos).
// Se o navegador não suportar, usa o mapa padrão do OpenStreetMap como reserva.
const escuro = () => document.documentElement.dataset.tema === 'escuro';
const estiloMapa = () => 'https://tiles.openfreemap.org/styles/' + (escuro() ? 'dark' : 'positron');
// O estilo "dark" do OpenFreeMap é quase preto. Por cima dele, uma paleta cinza-azulada mais clara,
// no tom das barras do app, com ruas bem visíveis.
const ESCURO_CLARO = {
  'background':              {'background-color':'#1E2833'},
  'landuse_residential':     {'fill-color':'#232E3A'},
  'landcover_wood':          {'fill-color':'#1F3330'},
  'landuse_park':            {'fill-color':'#1F3330'},
  'landcover_ice_shelf':     {'fill-color':'#1E2833'},
  'landcover_glacier':       {'fill-color':'#1E2833'},
  'water':                   {'fill-color':'#173149'},
  'waterway':                {'line-color':'#173149'},
  'water_name':              {'text-color':'#7FA6C9', 'text-halo-color':'#173149'},
  'building':                {'fill-color':'#2A3644'},
  'aeroway-area':            {'fill-color':'#2A3644'},
  'aeroway-runway':          {'line-color':'#3A4757'},
  'aeroway-taxiway':         {'line-color':'#3A4757'},
  'road_area_pier':          {'fill-color':'#1E2833'},
  'road_pier':               {'line-color':'#1E2833'},
  'highway_path':            {'line-color':'#36434F'},
  'highway_minor':           {'line-color':'#3B4859'},
  'highway_major_casing':    {'line-color':'rgba(105,120,140,.9)'},
  'highway_major_inner':     {'line-color':'#4A586C'},
  'highway_major_subtle':    {'line-color':'#4A586C'},
  'highway_motorway_casing': {'line-color':'rgba(130,145,165,.9)'},
  'highway_motorway_inner':  {'line-color':'#5A6A80'},
  'highway_motorway_subtle': {'line-color':'#4A586C'},
  'railway':                 {'line-color':'#4A5566'},
  'railway_minor':           {'line-color':'#4A5566'},
  'railway_transit':         {'line-color':'#4A5566'},
  'railway_dashline':        {'line-color':'#1E2833'},
  'railway_minor_dashline':  {'line-color':'#1E2833'},
  'railway_transit_dashline':{'line-color':'#1E2833'},
  'highway_name_other':      {'text-color':'#A9B6C4', 'text-halo-color':'#1E2833'},
  'highway_name_motorway':   {'text-color':'#B8C4D0'},
  'boundary_state':          {'line-color':'#4A5566'},
  'boundary_country_z0-4':   {'line-color':'#56627A'},
  'boundary_country_z5-':    {'line-color':'#56627A'}
};
function clarearEscuro(){
  if(!glMapa || !escuro()) return;
  const pintar = (id, props) => { if(glMapa.getLayer(id)) Object.entries(props).forEach(([k,v]) => glMapa.setPaintProperty(id, k, v)); };
  Object.entries(ESCURO_CLARO).forEach(([id, p]) => pintar(id, p));
  // Nomes de bairros, cidades e estados (place_*)
  (glMapa.getStyle()?.layers || []).filter(l => l.id.startsWith('place_')).forEach(l => pintar(l.id, {'text-color':'#C2CDD8', 'text-halo-color':'rgba(20,28,38,.85)'}));
  // Avenidas e rodovias muito grossas no estilo escuro (o usuário achou pesado no celular): afina
  // multiplicando as larguras de cada degrau do "interpolate" de zoom
  const afinar = (id, fator) => {
    if(!glMapa.getLayer(id)) return;
    const w = glMapa.getPaintProperty(id, 'line-width');
    if(!Array.isArray(w) || w[0] !== 'interpolate') return;
    // ['interpolate', tipo, ['zoom'], z1, largura1, z2, largura2, ...]: larguras nas posições 4, 6, 8...
    glMapa.setPaintProperty(id, 'line-width', w.map((v, i) => i >= 4 && i % 2 === 0 && typeof v === 'number' ? +(v*fator).toFixed(2) : v));
  };
  ['highway_major_casing', 'highway_major_inner'].forEach(id => afinar(id, .4));
  ['highway_motorway_casing', 'highway_motorway_inner'].forEach(id => afinar(id, .35));
}
let camadaLimpa, glMapa = null;
try{
  if(!L.maplibreGL || !window.maplibregl) throw new Error('sem maplibre');
  camadaLimpa = L.maplibreGL({
    style:estiloMapa(),
    attribution:'<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
  }).addTo(map);
  glMapa = camadaLimpa.getMaplibreMap();
  glMapa.on('styledata', () => {
    (glMapa.getStyle()?.layers || []).forEach(l => { if(l['source-layer']==='poi' && glMapa.getLayer(l.id)) glMapa.removeLayer(l.id); });
  });
  glMapa.on('style.load', () => { clarearEscuro(); GL.estiloPronto = true; montarGL(); });
  // Fluidez ao arrastar: a ponte Leaflet↔MapLibre reposiciona o fundo e só redesenha no quadro
  // seguinte, e o fundo "pulava" em relação aos marcadores. redraw() desenha na hora, junto.
  const transformarGL = camadaLimpa._transformGL;
  if(transformarGL) camadaLimpa._transformGL = function(gl){ transformarGL.call(this, gl); try{ gl.redraw(); }catch(e){} };
}catch(e){
  camadaLimpa = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, className:'osm', attribution:'© OpenStreetMap'}).addTo(map);
  $('#map').classList.add('reserva');
}
// Com o MapLibre funcionando, clientes, lugares e a linha da rota do dia são desenhados dentro do
// próprio mapa (andam junto com as ruas ao arrastar). No mapa reserva, viram marcadores do Leaflet.
const usarGL = !!glMapa;
var GL = {imagens:null, estiloPronto:false, satelite:false, rota:[]};
// Girar a tela ou abrir o teclado muda o tamanho do mapa. O Leaflet só percebe pelo evento de
// redimensionar a janela, que às vezes não chega; vigiando o próprio mapa, o desenho sempre acompanha.
function ajustarTamanhoMapa(){
  map.invalidateSize({pan:false});
  // A ponte com o MapLibre só redimensiona no quadro seguinte; aqui é na hora
  if(usarGL && camadaLimpa._resizeContainer){ try{ camadaLimpa._resizeContainer(); glMapa.resize(); camadaLimpa._update(); }catch(e){} }
}
if(window.ResizeObserver){
  let tTam;
  new ResizeObserver(() => { clearTimeout(tTam); tTam = setTimeout(ajustarTamanhoMapa, 100); }).observe($('#map'));
}
const camadaSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, attribution:'Imagens © Esri'
});
const grupo = L.layerGroup().addTo(map);
const marcadores = new Map();
let meuMarcador = null;

// Tamanho dos marcadores conforme o zoom do Leaflet (fonte única: GL, toque e Leaflet usam isto).
// Degraus relativos 50% / 60% / 70% (escolhidos pelo usuário; o de perto era 100% até 05/10/2026), tudo × TAMANHO_BASE = 1,8
// (pediu 80% maior em 02/10/2026). A gota original tem 26×35 px (cliente) e 32×43 px (lugar).
const TAMANHO_BASE = 1.8;
const DEGRAUS_TAMANHO = [[15, .7], [13, .6], [0, .5]]; // [a partir do zoom, tamanho relativo]
const TAMANHO_PERTO = TAMANHO_BASE * DEGRAUS_TAMANHO[0][1]; // tamanho no zoom de ruas, onde os nomes aparecem
const escalaZoom = z => TAMANHO_BASE * DEGRAUS_TAMANHO.find(([zz]) => z >= zz)[1];
function ajustarMarcadores(){
  const z = map.getZoom();
  $('#map').classList.toggle('labels', z >= 15);
  $('#map').style.setProperty('--esc', escalaZoom(z));
}
map.on('zoomend', ajustarMarcadores);
ajustarMarcadores();
map.on('contextmenu', e => { if(!document.body.classList.contains('picking') && !document.body.classList.contains('desenhando') && !marcadorNoPonto(e.latlng)) abrirFormulario({lat:e.latlng.lat, lng:e.latlng.lng}); });
// Toque no mapa: se acertou um marcador desenhado dentro do mapa, age como o toque no marcador
map.on('click', e => {
  const f = marcadorNoPonto(e.latlng); if(!f) return;
  const p = f.properties;
  if(f.layer.id === 'clientes') cliqueCliente(p.id);
  else if(p.tipo === 'casa'){ if(R.casa) cliqueLugar(R.casa, abrirCasa); }
  else { const h = hoteis.find(x=>x.id===p.id); if(h) cliqueLugar(h, () => abrirHotel(h.id)); }
});

// Gota no estilo Google Maps. Cliente: 26×35 com bolinha branca (ou "P" de prospecção).
// Hotel e casa ("grande"): 32×43 com o ícone branco dentro. A ponta é o ponto exato do local.
// Borda da gota: branca; laranja, na mesma espessura, nos clientes da rota mostrada no mapa
// (pedido do usuário em 05/10/2026, para bater o olho e ver quem está na rota)
const BORDA_ROTA = '#F97316';
function svgGota(cor, miolo, grande, borda){
  const d = grande ? 'M16 42C16 42 2.5 26.6 2.5 16A13.5 13.5 0 0 1 29.5 16C29.5 26.6 16 42 16 42Z'
                   : 'M13 34C13 34 2 21.6 2 13A11 11 0 0 1 24 13C24 21.6 13 34 13 34Z';
  const [w,h] = grande ? [32,43] : [26,35];
  // Sombra desenhada dentro da gota (cópia escura deslocada + mancha na ponta): mesmo efeito do
  // filter:drop-shadow, mas sem custo para o celular a cada quadro ao arrastar o mapa
  return `<svg class="gota" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><ellipse cx="${w/2}" cy="${h-1}" rx="${grande?5:4}" ry="1.6" fill="rgba(0,0,0,.28)"/><path d="${d}" transform="translate(.9 1.3)" fill="rgba(0,0,0,.25)"/><path d="${d}" fill="${cor}" stroke="${borda || '#fff'}" stroke-width="2"/>${miolo}</svg>`;
}
// Miolo da gota do cliente: bolinha branca, ou "P" de prospecção
const mioloCliente = (cor, prospect) => prospect
  ? `<circle cx="13" cy="13" r="7.2" fill="#fff"/><text x="13" y="17.1" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="11.5" font-weight="700" fill="${cor}">P</text>`
  : `<circle cx="13" cy="13" r="4.3" fill="#fff"/>`;
// Tamanho extra de cada cliente: na rota do dia mostrada no mapa fica 25% maior;
// com a ficha aberta, 30% (45% se também estiver na rota)
const FATOR_ROTA = 1.25, FATOR_SEL = 1.3, FATOR_SEL_ROTA = 1.45;
// Rota escondida do mapa (pedido do usuário em 05/10/2026: "desligar" a rota para fazer outra coisa).
// Só some do mapa (linha, números e gotas maiores); a rota continua salva. Fica só neste aparelho.
var rotaOculta = (() => { try{ return localStorage.getItem('mapaClientes.rotaOculta') === '1'; }catch(e){ return false; } })();
function mostrarRota(sim){
  if(rotaOculta === !sim) return;
  rotaOculta = !sim;
  try{ localStorage.setItem('mapaClientes.rotaOculta', rotaOculta ? '1' : '0'); }catch(e){}
  desenharRota();
}
const idsNaRota = () => new Set(rotaOculta ? [] : ((typeof rotaDoDia === 'function' && rotaDoDia(false)) || {paradas:[]}).paradas);
function fatorCliente(c, naRota){
  const r = (naRota || idsNaRota()).has(c.id), s = c.id === selId;
  return s ? (r ? FATOR_SEL_ROTA : FATOR_SEL) : (r ? FATOR_ROTA : 1);
}
function iconeDe(c){
  const cor = (STATUS[c.status]||STATUS.nao).cor;
  return L.divIcon({
    className:'', iconSize:[26,35], iconAnchor:[13,34],
    html:`<div class="pin${c.id===selId?' sel':''}" style="--c:${cor};--f:${fatorCliente(c)}">${svgGota(cor, mioloCliente(cor, ehP(c)), false, idsNaRota().has(c.id) ? BORDA_ROTA : null)}<span class="lbl">${esc(c.nome)}</span></div>`
  });
}
// Toque num cliente (vale para o marcador do Leaflet e para o desenhado dentro do mapa)
function cliqueCliente(id){
  const c = clientes.find(x=>x.id===id); if(!c) return;
  if(typeof desenho!=='undefined' && desenho){ addMarco(c.lat, c.lng); return; }
  if(typeof modoSelecao!=='undefined' && modoSelecao){ const dentro = alternarNaRota(c.id); toast(dentro ? `${c.nome}: incluído` : `${c.nome}: retirado`); }
  else abrirDetalhe(c.id);
}
function desenhar(){
  grupo.clearLayers(); marcadores.clear();
  if(usarGL) atualizarGL();      // marcadores desenhados dentro do mapa (veja "Marcadores no mapa")
  else clientes.filter(passaFiltro).forEach(c => {
    const m = L.marker([c.lat,c.lng], {icon:iconeDe(c), title:c.nome, keyboard:true});
    m.on('click', () => cliqueCliente(c.id));
    m.addTo(grupo); marcadores.set(c.id, m);
  });
  desenharChips();
  desenharLugares();
  if(typeof desenharRota==='function') desenharRota();
}

/* ================= Filtros ================= */
function desenharChips(){
  try{ localStorage.setItem(KEY_FILTRO, filtro); }catch(e){}
  const cont = {todos:clientes.length, atraso:clientes.filter(atrasado).length, prospect:clientes.filter(ehP).length};
  Object.keys(STATUS).forEach(k => cont[k] = clientes.filter(c=>c.status===k).length);
  const itens = [['todos','Todos',null], ['prospect','Prospecção','var(--tipo)'], ...Object.entries(STATUS).map(([k,s])=>[k,s.label,s.cor]), ['atraso',`${DIAS_ATRASO}+ dias sem visita`,'var(--tipo)']];
  $('#chips').innerHTML = itens.map(([k,l,cor]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${filtro===k}" ${cor?`style="--c:${cor}"`:''}>${cor?`<span class="dot${k==='prospect'?' p':''}"></span>`:''}${l} <span class="n">${cont[k]}</span></button>`
  ).join('');
  // Lugares (hotéis e casa): filtro que esconde os clientes e mostra só eles
  const nLugares = hoteis.length + (R.casa ? 1 : 0);
  $('#chips .chip[data-f="todos"]').insertAdjacentHTML('afterend', `<button class="chip" data-f="lugares" aria-pressed="${filtro==='lugares'}"><span class="lugar mini" style="--c:${LUGAR.hotel.cor}">${svgLugar('hotel',11)}</span>Lugares <span class="n">${nLugares}</span></button>`);
  const legado = clientes.filter(c=>c.status==='visitado').length;
  if(legado) $('#chips').insertAdjacentHTML('afterbegin', `<button class="chip revisar" id="revisar">Revisar ${legado} "Visitado"</button>`);
}
$('#chips').addEventListener('click', e => {

/* ---------- Digitar coordenadas ---------- */
// Aceita "-6.067512, -49.902034" (Google Maps), "-6,0675 -49,9020" (vírgula decimal),
// 6°04'03.0"S 49°54'07.3"W (graus) e links do Google Maps com @lat,lng ou q=lat,lng
function lerCoordenadas(txt){
  let s = String(txt||'').trim().toUpperCase();
  if(!s) return null;
  let lat, lng;
  if(s.includes('°')){
    const re = /(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['′’]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:["″”]|'')\s*)?([NSEWLO])?/g;
    const partes = [...s.matchAll(re)].map(m => {
      const n = x => parseFloat(String(x||0).replace(',','.'));
      let v = n(m[1]) + n(m[2])/60 + n(m[3])/3600;
      if(['S','W','O'].includes(m[4])) v = -v;
      return {v, h:m[4]};
    });
    if(partes.length < 2) return null;
    // Se vier longitude primeiro (E/W/L/O), inverte
    if(['E','W','L','O'].includes(partes[0].h)) [partes[0], partes[1]] = [partes[1], partes[0]];
    lat = partes[0].v; lng = partes[1].v;
  } else {
    if(s.includes('@')) s = s.slice(s.indexOf('@')+1);
    else if(/[?&](Q|QUERY|LL)=/.test(s)) s = s.slice(s.search(/[?&](Q|QUERY|LL)=/));
    if(!s.includes('.') && (s.match(/-?\d+,\d+/g)||[]).length >= 2) s = s.replace(/(\d),(\d)/g, '$1.$2');
    const n = s.match(/-?\d+(?:\.\d+)?/g);
    if(!n || n.length < 2) return null;
    lat = parseFloat(n[0]); lng = parseFloat(n[1]);
  }
  if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return {lat, lng};
}
const noBrasil = p => p.lat < 6 && p.lat > -34 && p.lng < -34 && p.lng > -74;
function abrirCoordenadas(){
  abrirPainel(`
    <h2>Latitude e longitude</h2>
    <p class="muted" style="margin:0 0 4px;line-height:1.45">Onde fica ${OQUE[marcarComo]}?</p>
    <label class="f">Coordenadas<input class="inp" id="cTxt" placeholder="-6.067512, -49.902034" autocomplete="off" inputmode="text"></label>
    <p class="muted" style="font-size:14px;line-height:1.45;margin:10px 0 0">No Google Maps, toque e segure no local e copie os números que aparecem. Também aceita o formato em graus, como 6°04'03"S 49°54'07"W, e links do Google Maps.</p>
    <div class="row" style="margin-top:16px">
      <button class="btn grow" data-a="coordVoltar">Voltar</button>
      <button class="btn primary grow" data-a="coordOk">Continuar</button>
    </div>`);
  setTimeout(() => $('#cTxt')?.focus(), 260);
  $('#cTxt').addEventListener('keydown', e => { if(e.key==='Enter') usarCoordenadas(); });
}
function usarCoordenadas(){
  let p = lerCoordenadas($('#cTxt').value);
  if(!p){ toast('Não entendi essas coordenadas. Exemplo: -6.067512, -49.902034'); $('#cTxt').focus(); return; }
  // Esqueceu o sinal de menos? No Brasil, latitude e longitude quase sempre são negativas
  if(!noBrasil(p) && noBrasil({lat:-Math.abs(p.lat), lng:-Math.abs(p.lng)})){
    p = {lat:-Math.abs(p.lat), lng:-Math.abs(p.lng)};
    toast('Coloquei o sinal de menos: no Brasil as coordenadas são negativas.');
  } else if(!noBrasil(p)) toast('Atenção: essas coordenadas ficam fora do Brasil.');
  marcarAqui(p);
}

function pegarGPS(ok){
  if(!navigator.geolocation){ toast('Este navegador não oferece GPS.'); return; }
  // Posição ao vivo recente: usa direto, sem esperar o GPS
  if(minhaPos && Date.now() - posEm < 15000){ ok({lat:minhaPos[0], lng:minhaPos[1]}); return; }
  toast('Buscando sua localização…');
  navigator.geolocation.getCurrentPosition(p => {
    minhaPos = [p.coords.latitude, p.coords.longitude]; precisao = p.coords.accuracy; posEm = Date.now();
    mostrarMinhaPos();
    ligarLocalizacao();
    ok({lat:minhaPos[0], lng:minhaPos[1]});
  }, err => {
    toast(err.code===1 ? 'Permita o acesso à localização nas configurações do navegador.' : 'Não consegui pegar o GPS. Tente em área aberta.');
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:10000});
}
let precisao = null, posEm = 0, circuloPrecisao = null;
function mostrarMinhaPos(){
  if(!minhaPos) return;
  if(!meuMarcador) meuMarcador = L.marker(minhaPos, {icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}), interactive:false, zIndexOffset:1000}).addTo(map);
  else meuMarcador.setLatLng(minhaPos);
  // Círculo azul claro = margem de erro do GPS (só quando passa de 25 m)
  if(precisao && precisao > 25){
    if(!circuloPrecisao) circuloPrecisao = L.circle(minhaPos, {radius:precisao, color:'#2F7BF6', weight:1, opacity:.4, fillColor:'#2F7BF6', fillOpacity:.1, interactive:false}).addTo(map);
    else circuloPrecisao.setLatLng(minhaPos).setRadius(precisao);
  } else if(circuloPrecisao){ circuloPrecisao.remove(); circuloPrecisao = null; }
}

/* ---------- Localização em tempo real ---------- */
// O ponto azul acompanha você enquanto o app está aberto. Com o app em segundo plano, o GPS é desligado para poupar bateria.
let watchLocal = null, seguirMim = false, rotaDesenhadaEm = null, localAtivo = false;
function ligarLocalizacao(){
  localAtivo = true;
  if(!navigator.geolocation || watchLocal !== null || document.visibilityState !== 'visible') return;
  watchLocal = navigator.geolocation.watchPosition(p => {
    minhaPos = [p.coords.latitude, p.coords.longitude]; precisao = p.coords.accuracy; posEm = Date.now();
    mostrarMinhaPos();
    // Não move o mapa enquanto você marca um local, desenha rota ou acompanha uma rota (que já centraliza sozinha)
    const ocupado = document.body.classList.contains('picking') || document.body.classList.contains('desenhando') || seguindo;
    if(seguirMim && !ocupado) map.panTo(minhaPos, {animate:true});
    // A linha da rota do dia sai da sua posição: redesenha só quando você andar mais de 50 m
    if(!rotaDesenhadaEm || map.distance(rotaDesenhadaEm, minhaPos) > 50){ rotaDesenhadaEm = minhaPos; desenharRota(); }
    // Visita em andamento: encerra sozinha quando você se afasta do local
    checarVisitaGps(p.coords.latitude, p.coords.longitude, p.coords.accuracy, Date.now());
  }, err => {
    if(err.code===1){ desligarLocalizacao(); localAtivo = false; }
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
}
function desligarLocalizacao(){
  if(watchLocal !== null){ navigator.geolocation.clearWatch(watchLocal); watchLocal = null; }
}
function seguirMinhaPos(on){
  seguirMim = on;
  $('#locBtn').classList.toggle('on', on);
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ if(localAtivo) ligarLocalizacao(); }
  else desligarLocalizacao(); // localAtivo continua true para religar ao voltar
});
// Arrastar o mapa com o dedo para de seguir você

// Se a permissão já foi dada antes, liga sozinho ao abrir o app (não pergunta nada)
if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'geolocation'}).then(s => { if(s.state === 'granted') ligarLocalizacao(); }).catch(()=>{});
}

    const fotoNova = await guardarFoto(campoFoto.blob);
    if(fotoNova) dados.fachada = fotoNova;
    let alvoId = id;
    if(id) Object.assign(c, dados);
    else { alvoId = uid(); clientes.push({id:alvoId, ...dados, origem:dados.tipo, lat:c.lat, lng:c.lng, criadoEm:new Date().toISOString(), visitas:[]}); }
    salvar(); desenhar(); abrirDetalhe(alvoId);
    toast(id ? 'Alterações salvas' : 'Cliente salvo');
  };
  // Exclui na hora e oferece "Desfazer" (volta com histórico e nas rotas em que estava)
  if(id) $('#fDel').onclick = () => {
    const pos = clientes.indexOf(c);
    const naRota = Object.entries(R.rotas).flatMap(([k,r]) => { const p = r.paradas.indexOf(id); return p < 0 ? [] : [[k, p, r.feitas.includes(id)]]; });
    clientes = clientes.filter(x=>x.id!==id); salvar(); selId=null; fecharPainel(); desenhar(); desenharRota();
    avisoDesfazer(`"${c.nome}" excluído`, () => {
      if(clientes.some(x=>x.id===id)) return;
      clientes.splice(Math.min(pos, clientes.length), 0, c); salvar();
      naRota.forEach(([k, p, feita]) => { const r = R.rotas[k]; if(r && !r.paradas.includes(id)){ r.paradas.splice(Math.min(p, r.paradas.length), 0, id); if(feita) r.feitas.push(id); } });
      salvarR(); desenhar(); desenharRota(); abrirDetalhe(id);
    });
  };
}
async function enderecoAutomatico(lat,lng){

/* ================= Fotos (fachada) ================= */
// Fotos não cabem no localStorage (~5 MB no total): ficam no IndexedDB do aparelho, reduzidas para
// ~800 px em JPEG de qualidade baixa (uns 40–60 KB; só para reconhecer o local). A visita guarda só {id, nuvem?}. Com login, sobem para o Storage do
// Supabase (depósito "fotos", pasta = id do usuário) e outro aparelho baixa quando for mostrar.
const FotoDB = (() => {
  let dbP = null;
  const abrir = () => dbP || (dbP = new Promise((ok, erro) => {
    const r = indexedDB.open('mapaClientes-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');
    r.onsuccess = () => ok(r.result); r.onerror = () => { dbP = null; erro(r.error); };
  }));
  const tx = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, erro) => { const t = db.transaction('fotos', modo), req = fn(t.objectStore('fotos')); t.oncomplete = () => ok(req && req.result); t.onerror = () => erro(t.error); });
  };
  return { salvar:(id, blob) => tx('readwrite', s => s.put(blob, id)), ler:id => tx('readonly', s => s.get(id)), limpar:() => tx('readwrite', s => s.clear()) };
})();
const urlsFoto = new Map();
async function urlDaFoto(foto){
  if(!foto || !foto.id) return null;
  if(urlsFoto.has(foto.id)) return urlsFoto.get(foto.id);
  let blob = null;
  try{ blob = await FotoDB.ler(foto.id); }catch(e){}
  if(!blob && foto.nuvem && nuvem.sb && nuvem.usuario){
    try{ const {data} = await nuvem.sb.storage.from('fotos').download(foto.nuvem); if(data){ blob = data; FotoDB.salvar(foto.id, blob).catch(()=>{}); } }catch(e){}
  }
  if(!blob) return null;
  const u = URL.createObjectURL(blob); urlsFoto.set(foto.id, u); return u;
}
// Coloca a foto em todos os <img data-foto="id"> do painel
function mostrarFotos(raiz){
  (raiz || document).querySelectorAll('img[data-foto]').forEach(async img => {
    const u = await urlDaFoto({id:img.dataset.foto, nuvem:img.dataset.nuvem || ''});
    if(u){ img.src = u; img.hidden = false; } else img.closest('.fachada')?.remove();
  });
}
async function reduzirFoto(file, max = 800, q = .55){ // só para reconhecer o local (pedido do usuário): ~40–60 KB por foto
  let src;
  try{ src = await createImageBitmap(file); }
  catch(e){ src = await new Promise((ok, erro) => { const im = new Image(); im.onload = () => ok(im); im.onerror = erro; im.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w*s); cv.height = Math.round(h*s);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return new Promise(ok => cv.toBlob(ok, 'image/jpeg', q));
}

  const fotos = (c.visitas||[]).filter(v => v.foto && v.foto.id).map(v => ({...v.foto, data:v.data}));

}
// Campo "Tirar foto da fachada" (cadastro do cliente). Devolve {pronta(), blob}: pronta() espera a foto ficar pronta.
const svgCamera = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

  <button type="button" class="btn block" id="${idp}Btn">${svgCamera}<span>${texto}</span></button><input type="file" id="${idp}Inp" accept="image/*" hidden></div>`;

        if($('#' + idp + 'Btn span')) $('#' + idp + 'Btn span').textContent = 'Trocar foto';
      }catch(err){ if($('#' + idp + 'Btn span')) $('#' + idp + 'Btn span').textContent = 'Tirar foto da fachada'; toast('Não consegui abrir essa foto.'); }
    })();
  };
  return st;
}
// Guarda a foto no aparelho e devolve a referência {id, data}, ou null
async function guardarFoto(blob){
  if(!blob) return null;
  const id = uid();
  try{ await FotoDB.salvar(id, blob); return {id, data:new Date().toISOString()}; }
  catch(e){ toast('Não consegui guardar a foto neste aparelho.'); return null; }
}

// Envia para a nuvem as fotos que ainda não foram (chamado ao fim de cada sincronização)
async function enviarFotos(){
  if(!nuvem.sb || !nuvem.usuario) return;
  // Fotos ainda não enviadas: a da fachada no cadastro (c.fachada) e as das visitas (v.foto)
  const pend = [];
  clientes.forEach(c => {
    if(c.fachada && c.fachada.id && !c.fachada.nuvem) pend.push(c.fachada);
    (c.visitas||[]).forEach(v => { if(v.foto && v.foto.id && !v.foto.nuvem) pend.push(v.foto); });
  });
  nuvem.avisoFotos = '';
  let mudou = false;
  for(const foto of pend){
    let blob = null; try{ blob = await FotoDB.ler(foto.id); }catch(e){}
    if(!blob) continue; // foto tirada em outro aparelho que ainda não subiu
    const caminho = `${nuvem.usuario.id}/${foto.id}.jpg`;
    const {error} = await nuvem.sb.storage.from('fotos').upload(caminho, blob, {contentType:'image/jpeg', upsert:true});
    if(error){
      nuvem.avisoFotos = /bucket|not found/i.test(error.message) ? 'Fotos aguardando: falta criar o depósito "fotos" no Supabase.' : 'Fotos aguardando envio: ' + error.message;
      break;
    }
    foto.nuvem = caminho; mudou = true;
  }
  if(mudou) salvar(); // grava o caminho; a próxima sincronização leva para a nuvem
}

/* ================= Visita com cronômetro ================= */
// "Registrar visita" inicia a visita e grava a hora. Encerra pelo botão ou sozinha quando você se afasta
// mais de 50 m do local (2 leituras do GPS com pelo menos 10 s entre elas; desconta a margem de erro).
// O local de referência é onde você estava ao iniciar (se estava a até 150 m do cliente) ou o próprio
// cliente; nesse caso só "arma" quando o GPS confirmar que você chegou. Se o app ficou parado (tela
// apagada) e só depois percebeu que você saiu, o fim é a última vez em que você estava no local.
// Fica em mapaClientes.visitaAtiva, só no aparelho, até registrar o resultado.
const KEY_VA = 'mapaClientes.visitaAtiva';
const RAIO_VISITA = 50;
let va = (() => { try{ return JSON.parse(localStorage.getItem(KEY_VA)) || null; }catch(e){ return null; } })();
function salvarVA(){
  try{ va ? localStorage.setItem(KEY_VA, JSON.stringify(va)) : localStorage.removeItem(KEY_VA); }catch(e){}
  atualizarFaixaVisita();
}
const hhmm = ms => new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
const minutosEntre = (a, b) => Math.max(0, Math.round((b - a) / 60000));
const fmtMin = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;
function iniciarVisita(id){
  const c = cli(id); if(!c) return;
  const agora = Date.now();
  const perto = !!(minhaPos && agora - posEm < 60000 && (precisao || 99) <= 50 && map.distance(minhaPos, [c.lat, c.lng]) <= 150);
  va = {clienteId:id, inicio:agora, ref: perto ? [...minhaPos] : [c.lat, c.lng], chegou:perto, ultimoPerto: perto ? agora : null, longe:0, longeDesde:null, fim:null};
  salvarVA(); ligarLocalizacao();
  abrirDetalhe(id);
  toast(`Visita iniciada às ${hhmm(agora)}`);
}
function encerrarVisita(motivo, fimMs){
  if(!va || va.fim) return;
  va.fim = fimMs || Date.now(); va.motivo = motivo; salvarVA();
  try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
  formVisita(va.clienteId);
  toast(motivo === 'auto' ? 'Visita encerrada: você se afastou do cliente' : 'Visita encerrada');
}
// A cada leitura do GPS (ligarLocalizacao)
function checarVisitaGps(lat, lng, acc, ts){
  if(!va || va.fim || acc > 50) return;
  const d = map.distance(va.ref, [lat, lng]);
  if(d <= RAIO_VISITA){
    if(!va.chegou || va.longe || ts - (va.ultimoPerto || 0) > 15000){ va.chegou = true; va.ultimoPerto = ts; va.longe = 0; va.longeDesde = null; salvarVA(); }
    return;
  }
  if(!va.chegou || d <= RAIO_VISITA + Math.min(acc, 30)) return; // na dúvida pela precisão, não conta
  if(!va.longe){ va.longe = 1; va.longeDesde = ts; salvarVA(); return; }
  va.longe++;
  if(ts - va.longeDesde < 10000){ salvarVA(); return; }
  encerrarVisita('auto', ts - (va.ultimoPerto || ts) > 120000 ? va.ultimoPerto : va.longeDesde);
}
// Faixa verde no topo do mapa enquanto há visita em andamento ou esperando o resultado
function atualizarFaixaVisita(){
  const el = $('#faixaVisita'); if(!el) return;
  const c = va && cli(va.clienteId);
  if(!c){ el.classList.remove('show'); return; }
  el.classList.add('show');
  $('#faixaVisitaTxt').textContent = va.fim ? `Visita em ${c.nome} encerrada · registrar resultado` : `Em visita: ${c.nome} · ${fmtMin(minutosEntre(va.inicio, Date.now()))}`;
  const t = $('#vaTempo'); if(t) t.textContent = fmtMin(minutosEntre(va.inicio, Date.now()));
}
setInterval(atualizarFaixaVisita, 20000);
$('#faixaVisita').onclick = () => { if(va) (va.fim ? formVisita : abrirDetalhe)(va.clienteId); };

/* ================= Leitor de código de barras ================= */
// Usa o BarcodeDetector do Chrome (Android): abre a câmera traseira em tela cheia, lê o primeiro código
// que aparecer e devolve o texto. Celular sem esse recurso: avisa para digitar.
async function lerCodigo(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Este celular não lê código de barras pelo navegador. Digite o código.'); return null; }
  let formatos = []; try{ formatos = await BarcodeDetector.getSupportedFormats(); }catch(e){}
  if(!formatos.length){ toast('Este celular não lê código de barras pelo navegador. Digite o código.'); return null; }
  const det = new BarcodeDetector({formats:formatos});
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }
  catch(e){ toast(e && e.name === 'NotAllowedError' ? 'Permita o uso da câmera para ler o código.' : 'Não consegui abrir a câmera.'); return null; }
  const el = $('#leitor'), video = $('#leitorVideo');
  video.srcObject = stream; el.classList.add('show');
  // Não fica preso esperando o vídeo começar: em até 1,5 s já passa a procurar o código
  await Promise.race([video.play().catch(() => {}), new Promise(ok => setTimeout(ok, 1500))]);
  return new Promise(ok => {
    let fim = false, t;
    const fechar = v => { if(fim) return; fim = true; clearTimeout(t); stream.getTracks().forEach(tr => tr.stop()); video.srcObject = null; el.classList.remove('show'); ok(v); };
    $('#leitorFechar').onclick = () => fechar(null);
    const ler = async () => {
      if(fim) return;
      try{ const r = await det.detect(video); if(r && r.length && r[0].rawValue){ try{ navigator.vibrate && navigator.vibrate(120); }catch(e){} fechar(r[0].rawValue); return; } }catch(e){}
      t = setTimeout(ler, 200);
    };
    ler();
  });
}
// Lê um código e acrescenta "Cód. 123..." no fim do campo de texto
async function inserirCodigo(seletor){
  const cod = await lerCodigo(); if(!cod) return;
  const ta = $(seletor); if(!ta) return;
  ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + 'Cód. ' + cod + ' ';
  ta.focus(); toast('Código lido: ' + cod);
}
const svgCodigo = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>';

/* ================= Anotações da visita e pendências do cliente ================= */
// Anotações: ficam na visita em andamento (va.notas, com horário) e entram no texto do resultado.
// Pendências: o que o cliente pediu para depois. Ficam no cliente (c.pendencias, vão para a nuvem)

}

const htmlAvisoPend = c => { const n = pendAbertas(c).length; return n ? `<button class="aviso-pend" id="irPend">📌 ${n} pendência${n===1?'':'s'} deste cliente</button>` : ''; };
// Redesenha só a seção (sem reabrir a ficha inteira, para não perder a rolagem nem o que está digitando)
function atualizarPendencias(c){

  const av = $('#avisoPendWrap'); if(av) av.innerHTML = htmlAvisoPend(c);
}
function ligarPendencias(id){
  const c = cli(id), el = $('#pendencias'); if(!c || !el) return;
  const wrap = $('#avisoPendWrap'); if(wrap) wrap.onclick = e => { if(e.target.closest('#irPend')) el.scrollIntoView({behavior:'smooth', block:'start'}); };
  el.onclick = async e => {
    const chk = e.target.closest('[data-p]'), del = e.target.closest('[data-pdel]');
    if(chk){ const p = c.pendencias.find(x => x.id === chk.dataset.p); if(!p) return; p.feita = p.feita ? null : new Date().toISOString(); salvar(); atualizarPendencias(c); toast(p.feita ? 'Pendência resolvida' : 'Pendência reaberta'); return; }
    if(del){
      const i = c.pendencias.findIndex(x => x.id === del.dataset.pdel); if(i < 0) return;
      const [p] = c.pendencias.splice(i, 1); salvar(); atualizarPendencias(c);

// Parte da ficha do cliente: iniciar, ou acompanhar/encerrar a visita em andamento
function blocoVisita(c){
  const ok = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';

function ligarBlocoVisita(id){

// Resultado da visita. Com cronômetro: início e fim já preenchidos (dá para corrigir).
// Sem cronômetro (manual): data e, se quiser, os horários.
function formVisita(id, manual){
  const c = clientes.find(x=>x.id===id); if(!c) return;
  const crono = !manual && va && va.clienteId === id && va.fim ? va : null;
  const iso = hojeKey();
  const hora = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  let fotoNova = null;
  abrirPainel(`
    <h2>Visita em ${esc(c.nome)}</h2>
    ${crono ? `<p class="muted" style="margin:0 0 4px">${crono.motivo === 'auto' ? 'Encerrada sozinha quando você se afastou.' : 'Encerrada pelo botão.'} Corrija os horários se precisar.</p>` : ''}
    <label class="f">Resultado</label>${segStatus('', RESULTADOS)}

      <label class="f grow" style="flex:1">Início<input class="inp" id="vIni" type="time" value="${crono ? hora(crono.inicio) : ''}"></label>
      <label class="f grow" style="flex:1">Fim<input class="inp" id="vFim" type="time" value="${crono ? hora(crono.fim) : ''}"></label>
